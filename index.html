<style>
  :root {
    --pitch: #0f3d2e;
    --pitch-dark: #0a2b20;
    --chalk: #f4f2ea;
    --chalk-dim: #b9c9c0;
    --gold: #d4a73d;
    --red-card: #c1443a;
    --line: rgba(244,242,234,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--pitch-dark);
    background-image:
      repeating-linear-gradient(0deg, var(--pitch) 0px, var(--pitch) 60px, var(--pitch-dark) 60px, var(--pitch-dark) 120px);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 32px 20px 20px;
    text-align: center;
    border-bottom: 2px solid var(--line);
  }
  header .eyebrow {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 48px);
    margin: 0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  header p.sub {
    color: var(--chalk-dim);
    margin-top: 8px;
    font-size: 14px;
  }
  header p.scope {
    color: var(--chalk-dim);
    margin-top: 4px;
    font-size: 12px;
    opacity: 0.75;
  }
  .controls {
    max-width: 900px;
    margin: 20px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    /* Without this, flexbox's default align-items: stretch forces the
       <select> to match the calendar card's height next to it - which
       is exactly what made it render as a huge oversized box instead of
       a normal dropdown. Top-align everything at its own natural size
       instead. */
    align-items: flex-start;
  }
  /* Calendar: replaces the old two-row "month pills / date pills" nav -
     same underlying data (allMonths() / allData), just presented as an
     actual month grid instead of a growing horizontal list of buttons,
     which used to run out of room and wrap awkwardly once a season's
     worth of dates was in play. */
  .calendar {
    width: 280px;
    max-width: 100%;
    background: rgba(244,242,234,0.04);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px 16px;
  }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .cal-title {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--chalk);
  }
  .cal-nav {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    transition: all 0.15s ease;
  }
  .cal-nav:hover:not(:disabled) { border-color: var(--gold); color: var(--chalk); }
  .cal-nav:disabled { opacity: 0.25; cursor: default; }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    color: var(--chalk-dim);
    font-size: 11px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--chalk-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: default;
    position: relative;
  }
  .cal-cell.cal-blank { visibility: hidden; }
  .cal-cell.has-matches {
    color: var(--chalk);
    border-color: var(--line);
    cursor: pointer;
    font-weight: 600;
  }
  .cal-cell.has-matches::after {
    content: '';
    position: absolute;
    bottom: 4px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
  }
  .cal-cell.has-matches:hover { border-color: var(--gold); }
  .cal-cell.today:not(.active) { border-color: var(--chalk-dim); }
  .cal-cell.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--pitch-dark);
  }
  .cal-cell.active::after { background: var(--pitch-dark); }
  .cal-all-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    transition: all 0.15s ease;

  .cal-all-btn:hover { border-color: var(--gold); color: var(--chalk); }
  .cal-all-btn.active { background: var(--gold); border-color: var(--gold); color: var(--pitch-dark); font-weight: 600; }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    transition: all 0.15s ease;
  }

  select {
    background: var(--pitch-dark);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .search-row {
    max-width: 900px;
    margin: 16px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;

  #team-search {
    background: rgba(244,242,234,0.06);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 9px 16px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    width: 220px;
    max-width: 60vw;
  }
  #team-search::placeholder { color: var(--chalk-dim); }
  .no-match { text-align: center; color: var(--chalk-dim); padding: 8px 0 0; font-size: 13px; }
  #postcode-input {

    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 9px 16px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;

    width: 180px;

  #postcode-input::placeholder { color: var(--chalk-dim); }
  .postcode-hint {
    max-width: 900px;
    margin: 6px auto 0;
    padding: 0 20px;
    text-align: center;
    color: var(--gold);
    font-size: 12px;
    min-height: 14px;
  }

  main {
    max-width: 900px;
    margin: 28px auto 60px;
    padding: 0 20px;
  }
  /* Sort/display hierarchy: date (the pills above) > league (tier order) >
     team. Each league-group sits directly under the selected date, and
     the league identity travels WITH its matches (label right above the
     team rows it belongs to) rather than as a separate badge floating
     off to the side, disconnected from the teams it describes. */
  /* When multiple dates are shown together (the "All dates" pill, or a
     team search - which can match fixtures on any date), fixtures are
     grouped under a date heading first, then by league within that date
     - so the sort hierarchy is genuinely date > league > team, not
     league-across-all-dates. A single selected date has only one date
     in play already, so it skips straight to the league groups below. */
  .date-heading {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;

  .league-group { margin-bottom: 28px; }
  .league-label {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    gap: 8px;

  .league-label .tier-tag {

    font-weight: 400;
    letter-spacing: 1px;

  .match {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 14px;

    margin-bottom: 10px;

    font-weight: 600;

    text-align: center;

  .teams .vs { color: var(--chalk-dim); font-weight: 400; padding: 0 2px; }
  .club-link {
    color: var(--chalk-dim);
    text-decoration: none;
    font-size: 12px;
    opacity: 0.7;
    margin-left: -2px;
  }

  .crest {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-family: 'Oswald', sans-serif;

    font-weight: 700;
    letter-spacing: 0.5px;

    flex-shrink: 0;

  .venue { color: var(--chalk-dim); font-size: 12px; margin-top: 3px; }
  .venue .addr { opacity: 0.8; }
  .venue .addr::before { content: " · "; }
  .matchday {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--pitch-dark);
    background: var(--chalk-dim);

    border-radius: 4px;
    white-space: nowrap;

  footer {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 12px;
    padding: 20px;
    opacity: 0.7;
  }
</style>

<header>

<main id="main">

<footer>Free & ad-free. Data refreshed automatically. Covers Bundesliga down through Landesliga — see README.</footer>

<script>
// Placeholder fixtures only — not real games. Shown until the live
// scrapers (scraper_openligadb.py / scraper_fussballde.py) have run and
// produced real data/index.json + data/<date>.json files.
//
// Every fixture below is internally consistent with real current
// divisions: Hertha BSC (BL2, tier 2) and 1. FC Union Berlin (BL1, tier
// 1) are shown against other clubs in THEIR OWN tier, never against
// each other, because that pairing can't happen in real league play
// while they sit in different divisions. Each fixture also carries an
// explicit `gender` and `league_tier` so the schema itself rules out
// the kind of mixup that produced the old demo data's Hertha-vs-Union
// fixture.
const DEMO_DATA = {

    { date: "2026-08-08", time: "14:00", home_team: "Berliner AK 07", away_team: "SV Lichtenberg 47", league: "OBERLIGA NORDOST", league_tier: 5, gender: "M", venue: "Poststadion", venue_address: "Rathenower Str. 42, 10559 Berlin" },
    { date: "2026-08-08", time: "15:00", home_team: "Tennis Borussia Berlin", away_team: "TuS Makkabi Berlin", league: "OBERLIGA NORDOST", league_tier: 5, gender: "M", venue: "Mommsenstadion", venue_address: "Waldschulallee 34, 14055 Berlin" }
  ],
  "2026-08-09": [
    { date: "2026-08-09", time: "14:00", home_team: "Hertha 03 Zehlendorf", away_team: "Eintracht Mahlsdorf", league: "OBERLIGA NORDOST", league_tier: 5, gender: "M", venue: "Rehwiese", venue_address: "Potsdamer Chaussee 4, 14109 Berlin" },
    { date: "2026-08-09", time: "14:00", home_team: "Füchse Berlin Reinickendorf", away_team: "SV Sparta Lichtenberg", league: "OBERLIGA NORDOST", league_tier: 5, gender: "M", venue: "Stadion Reinickendorf", venue_address: "Egellsstraße, 13407 Berlin" },
    { date: "2026-08-09", time: "13:00", home_team: "SC Staaken", away_team: "TSG Neustrelitz", league: "OBERLIGA NORDOST", league_tier: 5, gender: "M", venue: "Stadion Staaken", venue_address: "Reimerweg 30, 13593 Berlin" }
  ],
  "2026-08-15": [
    { date: "2026-08-15", time: "15:30", home_team: "Hertha BSC", away_team: "Karlsruher SC", league: "BL2", league_tier: 2, gender: "M", matchday: "Matchday 2", venue: "Olympiastadion Berlin", venue_address: "Olympischer Platz 3, 14053 Berlin" },
    { date: "2026-08-15", time: "14:00", home_team: "Tasmania Berlin", away_team: "BFC Dynamo", league: "REGIONALLIGA NORDOST", league_tier: 4, gender: "M", venue: "Werner-Seelenbinder-Sportpark", venue_address: "Oderstraße 182, 12049 Berlin" },
    { date: "2026-08-16", time: "14:00", home_team: "Blau-Weiss 90 Berlin", away_team: "1. FC Wilmersdorf", league: "BERLIN-LIGA", league_tier: 6, gender: "M", venue: "Poststadion Nebenplatz", venue_address: "Rathenower Str. 42, 10559 Berlin" },

  ],

    { date: "2026-08-22", time: "15:30", home_team: "1. FC Union Berlin", away_team: "Bayer Leverkusen", league: "BL1", league_tier: 1, gender: "M", matchday: "Matchday 2", venue: "Stadion An der Alten Försterei", venue_address: "Hämmerlingstraße 61, 12559 Berlin" },
    { date: "2026-08-22", time: "13:00", home_team: "SSC Südwest", away_team: "Fortuna Biesdorf", league: "BERLIN-LIGA", league_tier: 6, gender: "M", venue: "Poststadion", venue_address: "Rathenower Str. 42, 10559 Berlin" },
    { date: "2026-08-22", time: "14:00", home_team: "Türkiyemspor Berlin", away_team: "SV Empor Berlin", league: "BERLIN-LIGA", league_tier: 6, gender: "M", venue: "Stadion Rathenower Straße", venue_address: "Rathenower Str. 42, 10559 Berlin" },
    { date: "2026-08-22", time: "14:00", home_team: "TSV Mariendorf 1897", away_team: "Frohnauer SC", league: "BERLIN-LIGA", league_tier: 6, gender: "M", venue: "Sportplatz Mariendorf", venue_address: "Motzener Straße 20, 12277 Berlin" }
  ]
};

let allData = {};
let currentMonth = null;   // "YYYY-MM"
let currentDate = null;    // "YYYY-MM-DD", or null meaning "every date in currentMonth"

// No real club crests are used here (they're trademarked) — instead we
// generate a simple colored monogram per team from its initials.
const CREST_COLORS = ['#d4a73d', '#c1443a', '#6f9c73', '#8891c4', '#c48fa0', '#5fa8a0'];
function teamInitials(name) {
  const words = name.replace(/^\d+\.\s*/, '').split(/\s+/).filter(w => w.length > 1 || /[A-ZÄÖÜ]/.test(w));
  const letters = words.slice(0, 2).map(w => w[0]).join('');
  return (letters || name.slice(0, 2)).toUpperCase();
}
function teamColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return CREST_COLORS[Math.abs(hash) % CREST_COLORS.length];
}
function crestHtml(name) {
  return `<span class="crest" style="background:${teamColor(name)}">${teamInitials(name)}</span>`;
}

// Small "official club site" link next to a team name (ticket info etc.)
// - not the fussball.de match page (that's source_url), the club's own
// site. Blank/missing for clubs without one on file (e.g. lower amateur
// tiers, or Berlin Türkspor which genuinely has no independent site).
function clubLinkHtml(website) {
  if (!website) return '';
  return `<a href="${website}" target="_blank" rel="noopener noreferrer" class="club-link" title="Official club website" onclick="event.stopPropagation()">↗</a>`;
}

function fmtDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' });
}
function fmtMonthLabel(ym) {
  const [y, m] = ym.split('-');
  const d = new Date(Number(y), Number(m) - 1, 1);
  return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}
function monthOf(iso) {
  return iso.slice(0, 7); // "YYYY-MM-DD" -> "YYYY-MM"
}

// Fallback tier lookup for older/incoming data that might not carry an
// explicit league_tier yet. Keep in sync with both scrapers' tier maps.
const TIER_BY_LEAGUE = {
  "DFB-POKAL": 0, "BERLIN-POKAL": 0.5,
  "BL1": 1, "BL2": 2, "BL3": 3,
  "REGIONALLIGA NORDOST": 4, "OBERLIGA NORDOST": 5, "BERLIN-LIGA": 6,
  "LANDESLIGA STAFFEL 1": 7, "LANDESLIGA STAFFEL 2": 7,
};
function tierOf(m) {
  return typeof m.league_tier === "number" ? m.league_tier : (TIER_BY_LEAGUE[m.league] ?? 99);
}
// Cups aren't part of the league pyramid, so "Tier 0" would be
// meaningless to show - this decides whether a match belongs to a cup
// competition (explicit `is_cup` flag from live data, or a name-based
// fallback for older/demo data that predates the flag).
function isCup(m) {
  return Boolean(m.is_cup) || m.league === "DFB-POKAL" || m.league === "BERLIN-POKAL";
}

// "Closest to me" postcode feature - entirely client-side, no backend,
// no live geocoding API. One shared lookup table covers BOTH sides of
// the distance calc: the postcode a visitor types in, and the postcode
// already embedded in every fixture's own venue_address (e.g. "...,
// 14055 Berlin"). All 191 real Berlin postal codes, centroid lat/lon,
// rounded to 3 decimal places (~100m of rounding error - plenty for
// "which stadium is roughly closer," not meant for turn-by-turn).
// Sourced from OpenPLZ (which PLZs are real, current Berlin codes - not
// just numeric range guessing, which would wrongly sweep in Brandenburg
// towns like Schönefeld/Potsdam that share Berlin's 10000-14999 block)
// cross-checked against the WZB Berlin Social Science Center's

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function extractPlz(address) {
  const m = (address || '').match(/\b(\d{5})\b/);
  return m ? m[1] : null;
}
function coordsForPlz(plz) {
  return BERLIN_PLZ_COORDS[plz] || null;
}
// Returns null (rather than a distance) whenever either side can't be
// resolved - an unrecognized/incomplete postcode typed in, or a fixture
// whose venue_address doesn't carry a Berlin PLZ we have on file. The
// render code below is responsible for showing those as "distance
// unknown" rather than silently sorting them to the top as if 0km away.
function distanceFromPostcode(postcodeValue, venueAddress) {
  const from = coordsForPlz((postcodeValue || '').trim());
  const to = coordsForPlz(extractPlz(venueAddress));
  if (!from || !to) return null;
  return haversineKm(from[0], from[1], to[0], to[1]);
}

// Two-level nav: pick a MONTH first (via the ‹ › arrows), then
// optionally narrow to one DATE within it by clicking a day that has a
// gold dot on it ("show all fixtures this month" stays available below
// the grid so you can see everything before narrowing down). The
// calendar gets fully rebuilt on every click (not just the match list)
// - that's what keeps the "active"/"today" highlighting in sync with
// whatever's actually selected, instead of freezing on first render.
function allMonths() {
  return [...new Set(Object.keys(allData).map(monthOf))].sort();
}
function datesInCurrentMonth() {
  return Object.keys(allData).filter(d => monthOf(d) === currentMonth).sort();
}

function renderCalendar() {
  const el = document.getElementById('calendar');
  const months = allMonths();
  const idx = months.indexOf(currentMonth);
  const prevMonth = idx > 0 ? months[idx - 1] : null;
  const nextMonth = idx < months.length - 1 ? months[idx + 1] : null;

  const [y, m] = currentMonth.split('-').map(Number);
  const firstWeekday = (new Date(y, m - 1, 1).getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(y, m, 0).getDate();
  const today = todayIso();

  let cells = '';
  for (let i = 0; i < firstWeekday; i++) {
    cells += `<div class="cal-cell cal-blank"></div>`;
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${y}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const hasMatches = Boolean(allData[iso] && allData[iso].length);
    const classes = ['cal-cell'];
    if (hasMatches) classes.push('has-matches');
    if (iso === today) classes.push('today');
    if (iso === currentDate) classes.push('active');
    cells += `<button type="button" class="${classes.join(' ')}"${hasMatches ? ` data-date="${iso}"` : ' disabled'}>${day}</button>`;
  }

  el.innerHTML = `
    <div class="cal-header">
      <button type="button" class="cal-nav" id="cal-prev"${prevMonth ? '' : ' disabled'}>‹</button>
      <span class="cal-title">${fmtMonthLabel(currentMonth)}</span>
      <button type="button" class="cal-nav" id="cal-next"${nextMonth ? '' : ' disabled'}>›</button>
    </div>
    <div class="cal-weekdays">${['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(d => `<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <button type="button" class="cal-all-btn${currentDate === null ? ' active' : ''}" id="cal-all">Show all fixtures this month</button>
  `;

  if (prevMonth) el.querySelector('#cal-prev').onclick = () => { currentMonth = prevMonth; currentDate = null; renderAll(); };
  if (nextMonth) el.querySelector('#cal-next').onclick = () => { currentMonth = nextMonth; currentDate = null; renderAll(); };
  el.querySelector('#cal-all').onclick = () => { currentDate = null; renderAll(); };
  el.querySelectorAll('.cal-cell.has-matches').forEach(btn => {
    btn.onclick = () => { currentDate = btn.dataset.date; renderAll(); };
  });
}

function renderAll() {
  renderCalendar();
  render();
}

function populateLeagueFilter(matches) {
  const sel = document.getElementById('league-filter');
  const leagues = [...new Set(matches.map(m => m.league))]
    .sort((a, b) => tierOf({ league: a }) - tierOf({ league: b }));
  sel.innerHTML = '<option value="">All leagues</option>' + leagues.map(l => `<option value="${l}">${l}</option>`).join('');
}

// Native browser autocomplete for the team search box via <datalist> -
// no custom dropdown UI needed, the browser renders the suggestion list
// itself as you type. Only downside is it can't be restyled to match
// the pitch theme, but it's free, accessible, and works on mobile too.
function populateTeamList(matches) {
  const dl = document.getElementById('team-list');
  const teams = [...new Set(matches.flatMap(m => [m.home_team, m.away_team]))].sort();
  dl.innerHTML = teams.map(t => `<option value="${t}"></option>`).join('');
}

// Flat ranked list for "closest to me" / "kick-off time" sort modes -
// deliberately not grouped by date or league like the default view,
// since the whole point is one single ranking across everything in
// scope. Each row still shows its date and league inline (that context
// isn't implicit anymore once there's no date-heading/league-label
// grouping it). `hint` is the small message strip above the results -
// used to tell someone their postcode wasn't recognized rather than
// silently reordering nothing.
function renderFlatSorted(matches, mode, postcodeValue, hint) {
  let list = matches.slice();

  if (mode === 'distance') {
    if (!postcodeValue) {
      hint.textContent = 'Enter your postcode above to sort by distance.';
      list.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
    } else if (!coordsForPlz(postcodeValue)) {
      hint.textContent = `"${postcodeValue}" isn't a Berlin postcode I recognize - showing date order instead.`;
      list.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
    } else {
      list.forEach(m => { m.__distanceKm = distanceFromPostcode(postcodeValue, m.venue_address); });
      list.sort((a, b) => {
        if (a.__distanceKm == null && b.__distanceKm == null) return 0;
        if (a.__distanceKm == null) return 1;
        if (b.__distanceKm == null) return -1;
        return a.__distanceKm - b.__distanceKm;
      });
    }
  } else if (mode === 'time') {
    list.sort((a, b) => {
      if (!a.time && !b.time) return (a.date).localeCompare(b.date);
      if (!a.time) return 1;
      if (!b.time) return -1;
      return a.date === b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date);
    });
  }

  return list.map(m => {
    const tierTag = isCup(m) ? 'Cup' : `Tier ${tierOf(m)}`;
    const distanceNote = m.__distanceKm != null
      ? `<span class="addr">${m.__distanceKm < 1 ? '<1 km away' : Math.round(m.__distanceKm) + ' km away'}</span>`
      : (mode === 'distance' && postcodeValue && coordsForPlz(postcodeValue) ? `<span class="addr">distance unknown</span>` : '');
    return `
      <div class="match">
        <div class="match-time">${m.time || '—'}</div>
        <div>
          <div class="teams">${crestHtml(m.home_team)}${m.home_team}${clubLinkHtml(m.home_team_website)} <span class="vs">vs</span> ${crestHtml(m.away_team)}${m.away_team}${clubLinkHtml(m.away_team_website)}</div>
          <div class="venue">${fmtDateLabel(m.date)} · ${m.league} (${tierTag})${m.venue ? ' · ' + m.venue : ''}${distanceNote}</div>
        </div>
        <div class="matchday">${m.matchday || ''}</div>
      </div>
    `;
  }).join('');
}

function render() {
  const main = document.getElementById('main');
  const hint = document.getElementById('postcode-hint');
  const leagueFilter = document.getElementById('league-filter').value;
  const searchTerm = document.getElementById('team-search').value.trim().toLowerCase();
  const sortMode = document.getElementById('sort-mode').value; // "" | "distance" | "time"
  const postcodeValue = document.getElementById('postcode-input').value.trim();
  hint.textContent = '';

  // If searching by team, look across ALL dates, not just the selected
  // month/date - otherwise a search would silently show nothing outside
  // whatever's currently picked. Otherwise: a specific date if one's
  // selected, or every date in the current month if "All dates" is picked.
  // A distance/time sort (below) reuses whichever of those pools is
  // already in play - it doesn't widen or narrow the date range itself,
  // it just changes how the result gets grouped/ordered afterwards.
  const showingMultipleDates = Boolean(searchTerm) || currentDate === null;
  const pool = searchTerm
    ? Object.values(allData).flat()
    : currentDate
      ? (allData[currentDate] || [])
      : datesInCurrentMonth().flatMap(d => allData[d] || []);

  let filtered = leagueFilter ? pool.filter(m => m.league === leagueFilter) : pool;
  if (searchTerm) {
    filtered = filtered.filter(m =>
      m.home_team.toLowerCase().includes(searchTerm) ||
      m.away_team.toLowerCase().includes(searchTerm)
    );
  }

  if (!filtered.length) {
    const msg = searchTerm ? `No fixtures found for "${document.getElementById('team-search').value}".` : 'No fixtures found for this selection.';
    main.innerHTML = `<div class="empty"><span class="ball">⚽</span>${msg}</div>`;
    return;
  }

  // "Closest to me" / "kick-off time" are flat ranked lists across
  // whatever's currently in view (the month/date + league/search
  // filters above still apply) - deliberately NOT grouped by date or
  // league on top of that, since a genuine distance or time ranking
  // spanning several dates wouldn't make sense chopped up by date
  // headings first. Plain "date" mode below keeps the existing
  // date > league > team grouping untouched.
  if (sortMode === 'distance' || sortMode === 'time') {
    main.innerHTML = renderFlatSorted(filtered, sortMode, postcodeValue, hint);
    return;
  }

  // Sort hierarchy: date > league (by real tier order, not
  // alphabetically) > team. When only one date is in view (a specific
  // date pill selected), that outer "date" level is a no-op - there's
  // only one - so it goes straight to league groups. When several
  // dates are in view (the "All dates" pill, or any team search, which
  // can match fixtures on any date), matches are grouped under a date
  // heading FIRST and league groups sit inside each date, rather than
  // grouping by league across every date at once (which used to bury
  // "what's on which day" inside a date printed on every single match
  // row instead of leading with it).
  function renderLeagueGroups(matches) {
    const byLeague = {};
    matches.forEach(m => {
      (byLeague[m.league] = byLeague[m.league] || []).push(m);
    });
    const orderedLeagues = Object.keys(byLeague).sort((a, b) => {
      const ta = tierOf({ league: a, league_tier: byLeague[a][0]?.league_tier });
      const tb = tierOf({ league: b, league_tier: byLeague[b][0]?.league_tier });
      return ta !== tb ? ta - tb : a.localeCompare(b);
    });
    return orderedLeagues.map(league => {
      const ms = byLeague[league];
      const tier = tierOf(ms[0]);
      const tierTag = isCup(ms[0]) ? 'Cup' : `Tier ${tier}`;
      return `
      <div class="league-group">
        <div class="league-label">
          <span>${league}</span>
          <span class="tier-tag">${tierTag}</span>
        </div>
        ${ms.slice().sort((a,b) => (a.time||'').localeCompare(b.time||'')).map(m => `
          <div class="match">
            <div class="match-time">${m.time || '—'}</div>
            <div>
              <div class="teams">${crestHtml(m.home_team)}${m.home_team}${clubLinkHtml(m.home_team_website)} <span class="vs">vs</span> ${crestHtml(m.away_team)}${m.away_team}${clubLinkHtml(m.away_team_website)}</div>
              <div class="venue">${m.venue || ''}${m.venue_address ? `<span class="addr">${m.venue_address}</span>` : ''}</div>
            </div>
            <div class="matchday">${m.matchday || ''}</div>
          </div>
        `).join('')}
      </div>
    `;
    }).join('');
  }

  if (showingMultipleDates) {
    const byDate = {};
    filtered.forEach(m => { (byDate[m.date] = byDate[m.date] || []).push(m); });
    const orderedDates = Object.keys(byDate).sort();
    main.innerHTML = orderedDates.map(d => `
      <div class="date-heading">${fmtDateLabel(d)}</div>
      ${renderLeagueGroups(byDate[d])}
    `).join('');
  } else {
    main.innerHTML = renderLeagueGroups(filtered);
  }
}

async function init() {
  document.getElementById('league-filter').addEventListener('change', render);
  document.getElementById('team-search').addEventListener('input', render);
  document.getElementById('sort-mode').addEventListener('change', render);
  // Postcode is only numbers - restrict input as you type rather than
  // waiting to reject it on submit, and re-render on every keystroke so
  // "closest to me" updates live like everything else here.
  document.getElementById('postcode-input').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5);
    render();
  });
  // Clears the league dropdown, team search, and sort mode back to
  // "everything," and drops back to viewing the whole current month
  // rather than one single day - the calendar position itself (which
  // month you're looking at) is left alone since that's browsing, not
  // really a "filter." The postcode itself is deliberately NOT cleared -
  // it's more like "who you are" than a transient filter, no reason to
  // make someone retype it just for resetting everything else.
  document.getElementById('reset-filters').addEventListener('click', () => {
    document.getElementById('league-filter').value = '';
    document.getElementById('team-search').value = '';
    document.getElementById('sort-mode').value = '';
    currentDate = null;
    // Jump back to the CURRENT calendar month specifically, not just
    // "whatever month you happened to be on" - a reset should feel like
    // starting over, and starting over means today, not wherever you'd
    // navigated to. Falls back to the earliest month with any fixtures
    // if the current month itself has none (e.g. between seasons).
    const months = allMonths();
    const thisMonth = monthOf(todayIso());
    currentMonth = months.includes(thisMonth) ? thisMonth : months[0];
    renderAll();
  });

  try {
    const idxResp = await fetch('data/index.json');
    if (!idxResp.ok) throw new Error('no live data');
    const dates = await idxResp.json();
    for (const d of dates) {
      const r = await fetch(`data/${d}.json`);
      if (r.ok) allData[d] = await r.json();
    }
  } catch (e) {
    allData = DEMO_DATA;
  }

  allData = dropPastDates(allData);

  const months = allMonths();
  if (!months.length) {
    document.getElementById('main').innerHTML = `<div class="empty"><span class="ball">⚽</span>No fixture data available yet.</div>`;
    return;
  }
  currentMonth = months[0];
  currentDate = null; // start on "All dates" within the first month, per the ask to see everything before narrowing
  populateLeagueFilter(Object.values(allData).flat());
  populateTeamList(Object.values(allData).flat());
  renderAll();
}

// Drop any date that's already in the past, using the VISITOR'S local
// calendar day (not UTC - a "today" fixture shouldn't vanish for
// someone west of Berlin just because it's already tomorrow in UTC).
// This is a client-side safety net on top of the scrapers' own pruning
// (both scrapers drop past dates when they write data/) - it covers the
// gap between "a match's day ends" and "the next scheduled scrape run
// actually removes it," and also means a stale cached page still looks
// right. A whole month disappears from the month pills automatically
// once every one of its dates has been filtered out here - no separate
// "hide past months" logic needed, it falls out of this for free.
function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function dropPastDates(data) {
  const today = todayIso();

  for (const [d, matches] of Object.entries(data)) {
