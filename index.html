<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berlin Football — Fixtures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch: #0f3d2e;
    --pitch-dark: #0a2b20;
    --chalk: #f4f2ea;
    --chalk-dim: #b9c9c0;
    --gold: #d4a73d;
    --red-card: #c1443a;
    --line: rgba(244,242,234,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--pitch-dark);
    background-image:
      repeating-linear-gradient(0deg, var(--pitch) 0px, var(--pitch) 60px, var(--pitch-dark) 60px, var(--pitch-dark) 120px);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 32px 20px 20px;
    text-align: center;
    border-bottom: 2px solid var(--line);
  }
  header .eyebrow {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 48px);
    margin: 0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  header p.sub {
    color: var(--chalk-dim);
    margin-top: 8px;
    font-size: 14px;
  }
  .controls {
    max-width: 900px;
    margin: 20px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .dates {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px;
  }
  .date-pill {
    font-family: 'Oswald', sans-serif;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
    letter-spacing: 0.5px;
    transition: all 0.15s ease;
  }
  .date-pill:hover { border-color: var(--gold); color: var(--chalk); }
  .date-pill.active { background: var(--gold); border-color: var(--gold); color: var(--pitch-dark); font-weight: 600; }

  select {
    background: var(--pitch-dark);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .search-row {
    max-width: 900px;
    margin: 16px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #team-search {
    background: rgba(244,242,234,0.06);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 9px 16px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    width: 220px;
    max-width: 60vw;
  }
  #team-search::placeholder { color: var(--chalk-dim); }
  .no-match { text-align: center; color: var(--chalk-dim); padding: 8px 0 0; font-size: 13px; }

  main {
    max-width: 900px;
    margin: 28px auto 60px;
    padding: 0 20px;
  }
  .league-group { margin-bottom: 28px; }
  .league-label {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .match {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 14px;
    background: rgba(244,242,234,0.04);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .match-time {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--gold);
    text-align: center;
  }
  .teams { font-size: 16px; font-weight: 500; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .teams .vs { color: var(--chalk-dim); font-weight: 400; padding: 0 2px; }
  .crest {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-family: 'Oswald', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--pitch-dark);
    flex-shrink: 0;
  }
  .venue { color: var(--chalk-dim); font-size: 12px; margin-top: 3px; }
  .badge {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--pitch-dark);
    background: var(--chalk-dim);
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .empty {
    text-align: center;
    color: var(--chalk-dim);
    padding: 60px 20px;
    font-size: 15px;
  }
  .empty .ball { font-size: 32px; display: block; margin-bottom: 10px; }
  footer {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 12px;
    padding: 20px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Matchday</div>
  <h1>Berlin Football</h1>
  <p class="sub">Every club, every level — Bundesliga down to the local pitch.</p>
</header>

<div class="controls">
  <div class="dates" id="dates"></div>
  <select id="league-filter">
    <option value="">All divisions</option>
  </select>
</div>
<div class="search-row">
  <input id="team-search" type="text" placeholder="Search team…" autocomplete="off">
</div>

<main id="main">
  <div class="empty">Loading fixtures…</div>
</main>

<footer>Free & ad-free. Data refreshed automatically.</footer>

<script>
// Placeholder fixtures only — not real games. Shown until the live
// scrapers (scraper_openligadb.py / scraper_fussballde.py) have run
// and produced real data/index.json + data/<date>.json files.
const DEMO_DATA = {
  "2026-08-08": [
    { date: "2026-08-08", time: "15:30", home_team: "Hertha BSC", away_team: "1. FC Union Berlin", league: "BL2", venue: "Olympiastadion Berlin" },
    { date: "2026-08-08", time: "13:00", home_team: "BFC Dynamo", away_team: "Chemnitzer FC", league: "REGIONALLIGA NORDOST", venue: "Sportforum Berlin" },
    { date: "2026-08-08", time: "14:00", home_team: "VSG Altglienicke", away_team: "Tasmania Berlin", league: "REGIONALLIGA NORDOST", venue: "Sportpark Altglienicke" },
    { date: "2026-08-08", time: "14:00", home_team: "Berliner AK 07", away_team: "SV Lichtenberg 47", league: "OBERLIGA NORDOST", venue: "Poststadion" },
    { date: "2026-08-08", time: "15:00", home_team: "Tennis Borussia Berlin", away_team: "TuS Makkabi Berlin", league: "OBERLIGA NORDOST", venue: "Mommsenstadion" }
  ],
  "2026-08-09": [
    { date: "2026-08-09", time: "14:00", home_team: "Hertha 03 Zehlendorf", away_team: "Eintracht Mahlsdorf", league: "OBERLIGA NORDOST", venue: "Rehwiese" },
    { date: "2026-08-09", time: "14:00", home_team: "Füchse Berlin Reinickendorf", away_team: "SV Sparta Lichtenberg", league: "OBERLIGA NORDOST", venue: "Stadion Reinickendorf" },
    { date: "2026-08-09", time: "13:00", home_team: "SC Staaken", away_team: "TSG Neustrelitz", league: "OBERLIGA NORDOST", venue: "Stadion Staaken" }
  ],
  "2026-08-15": [
    { date: "2026-08-15", time: "15:30", home_team: "1. FC Union Berlin", away_team: "Hertha BSC", league: "BL2", venue: "Stadion An der Alten Försterei" },
    { date: "2026-08-15", time: "14:00", home_team: "Tasmania Berlin", away_team: "BFC Dynamo", league: "REGIONALLIGA NORDOST", venue: "Werner-Seelenbinder-Sportpark" },
    { date: "2026-08-16", time: "14:00", home_team: "Blau-Weiss 90 Berlin", away_team: "1. FC Wilmersdorf", league: "BERLIN-LIGA", venue: "Poststadion Nebenplatz" },
    { date: "2026-08-16", time: "14:00", home_team: "SC Charlottenburg", away_team: "Spandauer Kickers", league: "BERLIN-LIGA", venue: "Mommsenstadion" }
  ],
  "2026-08-22": [
    { date: "2026-08-22", time: "13:00", home_team: "SSC Südwest", away_team: "Fortuna Biesdorf", league: "BERLIN-LIGA", venue: "Poststadion" },
    { date: "2026-08-22", time: "14:00", home_team: "Türkiyemspor Berlin", away_team: "SV Empor Berlin", league: "BERLIN-LIGA", venue: "Stadion Rathenower Straße" },
    { date: "2026-08-22", time: "14:00", home_team: "TSV Mariendorf 1897", away_team: "Frohnauer SC", league: "BERLIN-LIGA", venue: "Sportplatz Mariendorf" }
  ]
};

let allData = {};
let currentDate = null;

// No real club crests are used here (they're trademarked) — instead we
// generate a simple colored monogram per team from its initials.
const CREST_COLORS = ['#d4a73d', '#c1443a', '#6f9c73', '#8891c4', '#c48fa0', '#5fa8a0'];
function teamInitials(name) {
  const words = name.replace(/^\d+\.\s*/, '').split(/\s+/).filter(w => w.length > 1 || /[A-ZÄÖÜ]/.test(w));
  const letters = words.slice(0, 2).map(w => w[0]).join('');
  return (letters || name.slice(0, 2)).toUpperCase();
}
function teamColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return CREST_COLORS[Math.abs(hash) % CREST_COLORS.length];
}
function crestHtml(name) {
  return `<span class="crest" style="background:${teamColor(name)}">${teamInitials(name)}</span>`;
}

function fmtDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' });
}

function renderDatePills(dates) {
  const el = document.getElementById('dates');
  el.innerHTML = '';
  dates.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'date-pill' + (d === currentDate ? ' active' : '');
    btn.textContent = fmtDateLabel(d);
    btn.onclick = () => { currentDate = d; render(); };
    el.appendChild(btn);
  });
}

function populateLeagueFilter(matches) {
  const sel = document.getElementById('league-filter');
  const leagues = [...new Set(matches.map(m => m.league))].sort();
  sel.innerHTML = '<option value="">All leagues</option>' + leagues.map(l => `<option value="${l}">${l}</option>`).join('');
}

function render() {
  const main = document.getElementById('main');
  const leagueFilter = document.getElementById('league-filter').value;
  const searchTerm = document.getElementById('team-search').value.trim().toLowerCase();

  // If searching by team, look across ALL dates, not just the selected one —
  // otherwise a search would silently show nothing on days with no matches.
  const pool = searchTerm
    ? Object.values(allData).flat()
    : (allData[currentDate] || []);

  let filtered = leagueFilter ? pool.filter(m => m.league === leagueFilter) : pool;
  if (searchTerm) {
    filtered = filtered.filter(m =>
      m.home_team.toLowerCase().includes(searchTerm) ||
      m.away_team.toLowerCase().includes(searchTerm)
    );
  }

  if (!filtered.length) {
    const msg = searchTerm ? `No fixtures found for "${document.getElementById('team-search').value}".` : 'No fixtures found for this day.';
    main.innerHTML = `<div class="empty"><span class="ball">⚽</span>${msg}</div>`;
    return;
  }

  const byLeague = {};
  filtered.forEach(m => {
    (byLeague[m.league] = byLeague[m.league] || []).push(m);
  });

  main.innerHTML = Object.entries(byLeague).map(([league, ms]) => `
    <div class="league-group">
      <div class="league-label">${league}</div>
      ${ms.sort((a,b) => (a.date + (a.time||'')).localeCompare(b.date + (b.time||''))).map(m => `
        <div class="match">
          <div class="match-time">${m.time || '—'}</div>
          <div>
            <div class="teams">${crestHtml(m.home_team)}${m.home_team} <span class="vs">vs</span> ${crestHtml(m.away_team)}${m.away_team}</div>
            <div class="venue">${searchTerm ? fmtDateLabel(m.date) + (m.venue ? ' · ' + m.venue : '') : (m.venue || '')}</div>
          </div>
          <div class="badge">${league}</div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

async function init() {
  document.getElementById('league-filter').addEventListener('change', render);
  document.getElementById('team-search').addEventListener('input', render);

  try {
    const idxResp = await fetch('data/index.json');
    if (!idxResp.ok) throw new Error('no live data');
    const dates = await idxResp.json();
    for (const d of dates) {
      const r = await fetch(`data/${d}.json`);
      if (r.ok) allData[d] = await r.json();
    }
  } catch (e) {
    allData = DEMO_DATA;
  }

  const dates = Object.keys(allData).sort();
  if (!dates.length) {
    document.getElementById('main').innerHTML = `<div class="empty"><span class="ball">⚽</span>No fixture data available yet.</div>`;
    return;
  }
  currentDate = dates[0];
  renderDatePills(dates);
  populateLeagueFilter(Object.values(allData).flat());
  render();
}

init();
</script>

</body>
</html>
