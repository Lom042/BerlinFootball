     generic blank-page icon - that's the "website version looks worse"
     gap, separate from "Add to Home Screen," which had nothing set
     either but falls back to auto-screenshotting the page instead (why
     that one already looked fine). A small inline SVG data URI needs no
     separate image file to host - a gold pitch center-circle mark on
     the same dark green as the rest of the theme. -->

<style>
  :root {
    --pitch: #0f3d2e;
    --pitch-dark: #0a2b20;
    --chalk: #f4f2ea;
    --chalk-dim: #b9c9c0;
    --gold: #d4a73d;
    --red-card: #c1443a;
    --line: rgba(244,242,234,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--pitch-dark);
    background-image:
      repeating-linear-gradient(0deg, var(--pitch) 0px, var(--pitch) 60px, var(--pitch-dark) 60px, var(--pitch-dark) 120px);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 32px 20px 20px;
    text-align: center;
    border-bottom: 2px solid var(--line);
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 48px);
    margin: 0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  header p.sub {
    color: var(--chalk-dim);
    margin-top: 8px;
    font-size: 14px;
  }
  /* Everything that controls WHAT you see (calendar, league, district,
     team, postcode, sort) lives inside one bordered card, stacked as
     full-width blocks rather than a cramped side-by-side row - once
     league/district/team became multi-select chip groups (each capable
     of wrapping onto several lines as you pick more than one), squeezing
     them next to the calendar in one flex row got messy fast. Stacking
     keeps every group readable at any screen width. */
  .filters-card {
    width: calc(100% - 40px);
    max-width: 460px;
    margin: 24px auto 0;
    padding: 22px 22px 24px;
    background: rgba(244,242,234,0.05);
    border: 1px solid var(--line);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .search-row {
    width: 100%;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  /* Calendar, and the league/district/team filter groups below it, all
     share the same "bordered box, wrapping row of chips" shape - .chip-
     group is basically the same box as .calendar, minus the month-nav
     header. Chips themselves (.chip) are shared by all four filters:
     dates, leagues, districts, and teams all look and behave the same
     way - click a chip to toggle it on or off. Every one of these is
     MULTI-select now (you can pick more than one date, league, district,
     or team at once), and each one narrows what the OTHERS offer - see
     matchesFilters() in the script below for how that mutual narrowing
     actually works. */
  .calendar, .chip-group {
    width: 100%;
    background: rgba(244,242,234,0.06);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px 16px;
  }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .cal-title {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--chalk);
  }
  .cal-nav {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    transition: all 0.15s ease;
  }
  .cal-nav:hover:not(:disabled) { border-color: var(--gold); color: var(--chalk); }
  .cal-nav:disabled { opacity: 0.25; cursor: default; }
  .filter-label {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 10px;
  }
  /* Deliberately NOT a full month grid with blank cells for every day
     that has nothing on - a real month, most days have no fixture at
     all, so a 31-cell grid was mostly dead space. This is just the
     handful of dates that actually have something AND are still
     consistent with whatever league/district/team is currently
     selected, as a wrapping row of chips. */
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .chip {
    font-family: 'Oswald', sans-serif;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    letter-spacing: 0.5px;
    transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--gold); color: var(--chalk); }
  .chip.today:not(.active) { border-color: var(--chalk-dim); border-style: dashed; }
  .chip.active { background: var(--gold); border-color: var(--gold); color: var(--pitch-dark); font-weight: 600; }
  .chip-empty-note { color: var(--chalk-dim); font-size: 13px; padding: 6px 0; }
  .chip-clear-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    transition: all 0.15s ease;
  }
  .chip-clear-btn:hover { border-color: var(--gold); color: var(--chalk); }
  .chip-clear-btn.active { background: var(--gold); border-color: var(--gold); color: var(--pitch-dark); font-weight: 600; }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    transition: all 0.15s ease;
  }
  .reset-btn:hover { border-color: var(--gold); color: var(--chalk); }

  select {
    background: var(--pitch-dark);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  #sort-mode { flex: 1 1 140px; max-width: 100%; }
  #team-search-input, #postcode-input {
    background: rgba(244,242,234,0.06);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 9px 16px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    flex: 1 1 140px;
    min-width: 0;
  }
  #team-search-input { width: 100%; margin-top: 4px; }
  #team-search-input::placeholder, #postcode-input::placeholder { color: var(--chalk-dim); }
  .no-match { text-align: center; color: var(--chalk-dim); padding: 8px 0 0; font-size: 13px; }
  .postcode-hint {
    width: 100%;
    text-align: center;
    color: var(--gold);
    font-size: 12px;
    min-height: 14px;
    margin: -4px 0 0;
  }

  main {
    max-width: 900px;
    margin: 28px auto 60px;
    padding: 0 20px;
  }
  /* Sort/display hierarchy: date (the pills above) > league (tier order) >
     team. Each league-group sits directly under the selected date, and
     the league identity travels WITH its matches (label right above the
     team rows it belongs to) rather than as a separate badge floating
     off to the side, disconnected from the teams it describes. */
  /* When multiple dates end up in view at once (no single date picked,
     or more than one date picked, or a league/district/team filter that
     matches fixtures spanning several dates), fixtures are grouped under
     a date heading first, then by league within that date - so the sort
     hierarchy is genuinely date > league > team, not league-across-all-
     dates. Results that land on exactly one date skip straight to the
     league groups below, no redundant single date heading. */
  .date-heading {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--chalk);
    margin: 26px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--gold);
  }
  .date-heading:first-of-type { margin-top: 0; }
  .league-group { margin-bottom: 28px; }
  .league-label {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .league-label .tier-tag {
    color: var(--chalk-dim);
    font-weight: 400;
    letter-spacing: 1px;
  }
  .match {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 14px;
    background: rgba(244,242,234,0.04);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .match-time {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--gold);
    text-align: center;
  }
  .teams { font-size: 16px; font-weight: 500; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .teams .vs { color: var(--chalk-dim); font-weight: 400; padding: 0 2px; }
  .club-link {
    color: var(--chalk-dim);
    text-decoration: none;
    font-size: 12px;
    opacity: 0.7;
    margin-left: -2px;
  }
  .club-link:hover { opacity: 1; text-decoration: underline; }
  .crest {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-family: 'Oswald', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--pitch-dark);
    flex-shrink: 0;
  }
  .venue { color: var(--chalk-dim); font-size: 12px; margin-top: 3px; }
  .venue .addr { opacity: 0.8; }
  .venue .addr::before { content: " · "; }
  .matchday {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--pitch-dark);
    background: var(--chalk-dim);
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    text-align: center;
  }
  .empty {
    text-align: center;
    color: var(--chalk-dim);
    padding: 60px 20px;
    font-size: 15px;
  }
  .empty .ball { font-size: 32px; display: block; margin-bottom: 10px; }
  footer {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 12px;
    padding: 20px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<header>

<div class="filters-card">

  <div class="chip-group" id="team-filter"></div>

      <option value="distance">Sort: closest to me</option>

<main id="main">

<footer>Free & ad-free. Data refreshed automatically. Covers Bundesliga down through Landesliga — see README.</footer>

<script>
// Placeholder fixtures only — not real games. Shown until the live
// scrapers (scraper_openligadb.py / scraper_fussballde.py) have run and
// produced real data/index.json + data/<date>.json files.
//
// Every fixture below is internally consistent with real current
// divisions: Hertha BSC (BL2, tier 2) and 1. FC Union Berlin (BL1, tier
// 1) are shown against other clubs in THEIR OWN tier, never against
// each other, because that pairing can't happen in real league play
// while they sit in different divisions. Each fixture also carries an
// explicit `gender` and `league_tier` so the schema itself rules out
// the kind of mixup that produced the old demo data's Hertha-vs-Union
// fixture.
const DEMO_DATA = {

    { date: "2026-08-08", time: "14:00", home_team: "VSG Altglienicke", away_team: "Tasmania Berlin", league: "REGIONALLIGA NORDOST", league_tier: 4, gender: "M", venue: "Sportpark Altglienicke", venue_address: "Rudolf-Seiffert-Straße 30, 12524 Berlin" },

  ],
  "2026-08-09": [
    { date: "2026-08-09", time: "14:00", home_team: "Hertha 03 Zehlendorf", away_team: "Eintracht Mahlsdorf", league: "OBERLIGA NORDOST", league_tier: 5, gender: "M", venue: "Rehwiese", venue_address: "Potsdamer Chaussee 4, 14109 Berlin" },
    { date: "2026-08-09", time: "14:00", home_team: "Füchse Berlin Reinickendorf", away_team: "SV Sparta Lichtenberg", league: "OBERLIGA NORDOST", league_tier: 5, gender: "M", venue: "Stadion Reinickendorf", venue_address: "Egellsstraße, 13407 Berlin" },
    { date: "2026-08-09", time: "13:00", home_team: "SC Staaken", away_team: "TSG Neustrelitz", league: "OBERLIGA NORDOST", league_tier: 5, gender: "M", venue: "Stadion Staaken", venue_address: "Reimerweg 30, 13593 Berlin" }
  ],
  "2026-08-15": [
    { date: "2026-08-15", time: "15:30", home_team: "Hertha BSC", away_team: "Karlsruher SC", league: "BL2", league_tier: 2, gender: "M", matchday: "Matchday 2", venue: "Olympiastadion Berlin", venue_address: "Olympischer Platz 3, 14053 Berlin" },
    { date: "2026-08-15", time: "14:00", home_team: "Tasmania Berlin", away_team: "BFC Dynamo", league: "REGIONALLIGA NORDOST", league_tier: 4, gender: "M", venue: "Werner-Seelenbinder-Sportpark", venue_address: "Oderstraße 182, 12049 Berlin" },
    { date: "2026-08-16", time: "14:00", home_team: "Blau-Weiss 90 Berlin", away_team: "1. FC Wilmersdorf", league: "BERLIN-LIGA", league_tier: 6, gender: "M", venue: "Poststadion Nebenplatz", venue_address: "Rathenower Str. 42, 10559 Berlin" },
    { date: "2026-08-16", time: "14:00", home_team: "SC Charlottenburg", away_team: "Spandauer Kickers", league: "BERLIN-LIGA", league_tier: 6, gender: "M", venue: "Mommsenstadion", venue_address: "Waldschulallee 34, 14055 Berlin" }
  ],
  "2026-08-22": [
    { date: "2026-08-22", time: "15:30", home_team: "1. FC Union Berlin", away_team: "Bayer Leverkusen", league: "BL1", league_tier: 1, gender: "M", matchday: "Matchday 2", venue: "Stadion An der Alten Försterei", venue_address: "Hämmerlingstraße 61, 12559 Berlin" },
    { date: "2026-08-22", time: "13:00", home_team: "SSC Südwest", away_team: "Fortuna Biesdorf", league: "BERLIN-LIGA", league_tier: 6, gender: "M", venue: "Poststadion", venue_address: "Rathenower Str. 42, 10559 Berlin" },
    { date: "2026-08-22", time: "14:00", home_team: "Türkiyemspor Berlin", away_team: "SV Empor Berlin", league: "BERLIN-LIGA", league_tier: 6, gender: "M", venue: "Stadion Rathenower Straße", venue_address: "Rathenower Str. 42, 10559 Berlin" },
    { date: "2026-08-22", time: "14:00", home_team: "TSV Mariendorf 1897", away_team: "Frohnauer SC", league: "BERLIN-LIGA", league_tier: 6, gender: "M", venue: "Sportplatz Mariendorf", venue_address: "Motzener Straße 20, 12277 Berlin" }
  ]
};

let allData = {};
let currentMonth = null;        // "YYYY-MM" - which month's dates the calendar box is currently showing
let selectedDates = new Set();  // "YYYY-MM-DD" - zero or more specific dates picked
let selectedLeagues = new Set();
let selectedDistricts = new Set();
let selectedTeams = new Set();
let teamSearchText = '';        // text currently typed into the "search team to add" box - only
                                 // narrows the SUGGESTION chips shown, doesn't filter fixtures
                                 // itself until you actually click a suggestion to add it

// No real club crests are used here (they're trademarked) — instead we
// generate a simple colored monogram per team from its initials.
const CREST_COLORS = ['#d4a73d', '#c1443a', '#6f9c73', '#8891c4', '#c48fa0', '#5fa8a0'];
function teamInitials(name) {
  const words = name.replace(/^\d+\.\s*/, '').split(/\s+/).filter(w => w.length > 1 || /[A-ZÄÖÜ]/.test(w));
  const letters = words.slice(0, 2).map(w => w[0]).join('');
  return (letters || name.slice(0, 2)).toUpperCase();
}
function teamColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return CREST_COLORS[Math.abs(hash) % CREST_COLORS.length];
}
function crestHtml(name) {
  return `<span class="crest" style="background:${teamColor(name)}">${teamInitials(name)}</span>`;
}

// Small "official club site" link next to a team name (ticket info etc.)
// - not the fussball.de match page (that's source_url), the club's own
// site. Blank/missing for clubs without one on file (e.g. lower amateur
// tiers, or Berlin Türkspor which genuinely has no independent site).
function clubLinkHtml(website) {
  if (!website) return '';
  return `<a href="${website}" target="_blank" rel="noopener noreferrer" class="club-link" title="Official club website" onclick="event.stopPropagation()">↗</a>`;
}

function fmtDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' });
}
function fmtMonthLabel(ym) {
  const [y, m] = ym.split('-');
  const d = new Date(Number(y), Number(m) - 1, 1);
  return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}
function monthOf(iso) {
  return iso.slice(0, 7); // "YYYY-MM-DD" -> "YYYY-MM"
}

// Fallback tier lookup for older/incoming data that might not carry an
// explicit league_tier yet. Keep in sync with both scrapers' tier maps.
const TIER_BY_LEAGUE = {
  "DFB-POKAL": 0, "BERLIN-POKAL": 0.5,
  "BL1": 1, "BL2": 2, "BL3": 3,
  "REGIONALLIGA NORDOST": 4, "OBERLIGA NORDOST": 5, "BERLIN-LIGA": 6,
  "LANDESLIGA STAFFEL 1": 7, "LANDESLIGA STAFFEL 2": 7,
};
function tierOf(m) {
  return typeof m.league_tier === "number" ? m.league_tier : (TIER_BY_LEAGUE[m.league] ?? 99);
}
// Cups aren't part of the league pyramid, so "Tier 0" would be
// meaningless to show - this decides whether a match belongs to a cup
// competition (explicit `is_cup` flag from live data, or a name-based
// fallback for older/demo data that predates the flag).
function isCup(m) {
  return Boolean(m.is_cup) || m.league === "DFB-POKAL" || m.league === "BERLIN-POKAL";
}

// "Closest to me" postcode feature - entirely client-side, no backend,
// no live geocoding API. One shared lookup table covers BOTH sides of
// the distance calc: the postcode a visitor types in, and the postcode
// already embedded in every fixture's own venue_address (e.g. "...,
// 14055 Berlin"). All 191 real Berlin postal codes, centroid lat/lon,
// rounded to 3 decimal places (~100m of rounding error - plenty for
// "which stadium is roughly closer," not meant for turn-by-turn).
// Sourced from OpenPLZ (which PLZs are real, current Berlin codes - not
// just numeric range guessing, which would wrongly sweep in Brandenburg
// towns like Schönefeld/Potsdam that share Berlin's 10000-14999 block)
// cross-checked against the WZB Berlin Social Science Center's
// plz_geocoord dataset (geocoded from the official Destatis postal code
// registry) for the actual coordinates.
// One flagged exception: "15569" straddles Berlin-Rahnsdorf and

function districtForAddress(address) {
  const plz = extractPlz(address);
  return plz ? (BERLIN_PLZ_DISTRICT[plz] || null) : null;
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function extractPlz(address) {
  const m = (address || '').match(/\b(\d{5})\b/);
  return m ? m[1] : null;
}
function coordsForPlz(plz) {
  return BERLIN_PLZ_COORDS[plz] || null;
}
// Returns null (rather than a distance) whenever either side can't be
// resolved - an unrecognized/incomplete postcode typed in, or a fixture
// whose venue_address doesn't carry a Berlin PLZ we have on file. The
// render code below is responsible for showing those as "distance
// unknown" rather than silently sorting them to the top as if 0km away.
function distanceFromPostcode(postcodeValue, venueAddress) {
  const from = coordsForPlz((postcodeValue || '').trim());
  const to = coordsForPlz(extractPlz(venueAddress));
  if (!from || !to) return null;
  return haversineKm(from[0], from[1], to[0], to[1]);
}

function allMonths() {
  return [...new Set(Object.keys(allData).map(monthOf))].sort();
}
function datesInCurrentMonth() {
  return Object.keys(allData).filter(d => monthOf(d) === currentMonth).sort();
}
function allMatches() {
  return Object.values(allData).flat();
}

// Every filter control (date calendar, league, district, team) can now
// have MULTIPLE values selected at once, and each one narrows what the
// OTHER controls offer: picking a date only shows leagues/districts/
// teams that actually have a fixture on that date; picking a league
// only shows dates/districts/teams with a fixture in that league; and
// so on. This is the single source of truth for "does this fixture
// satisfy everything currently selected" - every chip-rendering
// function below calls it with ONE dimension excluded (its own), so it
// can work out "what would still match if I ignore my own filter" to
// decide which of its own options to offer, while every OTHER active
// filter still narrows it.
function matchesFilters(m, exclude = {}) {
  if (!exclude.date && selectedDates.size && !selectedDates.has(m.date)) return false;
  if (!exclude.league && selectedLeagues.size && !selectedLeagues.has(m.league)) return false;
  if (!exclude.district && selectedDistricts.size) {
    const d = districtForAddress(m.venue_address);
    if (!d || !selectedDistricts.has(d)) return false;
  }
  if (!exclude.team && selectedTeams.size && !selectedTeams.has(m.home_team) && !selectedTeams.has(m.away_team)) return false;
  return true;
}

// Short "Sat 15" style label for a chip - keeps the weekday visible
// even without a full grid of day-of-week columns around it.
function fmtDayLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' });
}

function renderCalendar() {
  const el = document.getElementById('calendar');
  const months = allMonths();
  const idx = months.indexOf(currentMonth);
  const prevMonth = idx > 0 ? months[idx - 1] : null;
  const nextMonth = idx < months.length - 1 ? months[idx + 1] : null;
  const today = todayIso();

  // Only dates that (a) fall in the month currently being browsed AND
  // (b) still have a fixture matching whatever league/district/team is
  // currently selected - narrowed by the OTHER filters, per the note
  // above matchesFilters(). Any date already picked stays visible and
  // removable even if a later filter choice would otherwise hide it -
  // so you're never left with a selected chip you can't get back to in
  // order to deselect it.
  const matchingThisMonth = new Set(
    allMatches().filter(m => monthOf(m.date) === currentMonth && matchesFilters(m, { date: true })).map(m => m.date)
  );
  const keptSelected = datesInCurrentMonth().filter(d => selectedDates.has(d));
  const activeDates = [...new Set([...matchingThisMonth, ...keptSelected])].sort();

  const chips = activeDates.map(iso => {
    const classes = ['chip'];
    if (iso === today) classes.push('today');
    if (selectedDates.has(iso)) classes.push('active');
    return `<button type="button" class="${classes.join(' ')}" data-date="${iso}">${fmtDayLabel(iso)}</button>`;
  }).join('');

  el.innerHTML = `
    <div class="cal-header">
      <button type="button" class="cal-nav" id="cal-prev"${prevMonth ? '' : ' disabled'}>‹</button>
      <span class="cal-title">${fmtMonthLabel(currentMonth)}</span>
      <button type="button" class="cal-nav" id="cal-next"${nextMonth ? '' : ' disabled'}>›</button>
    </div>
    <div class="chip-row">${chips || '<div class="chip-empty-note">No fixtures match your other filters this month.</div>'}</div>
    <button type="button" class="chip-clear-btn${selectedDates.size === 0 ? ' active' : ''}" id="cal-all">Clear date selection</button>
  `;

  if (prevMonth) el.querySelector('#cal-prev').onclick = () => { currentMonth = prevMonth; renderAll(); };
  if (nextMonth) el.querySelector('#cal-next').onclick = () => { currentMonth = nextMonth; renderAll(); };
  el.querySelector('#cal-all').onclick = () => { selectedDates.clear(); renderAll(); };
  el.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => {
      const d = btn.dataset.date;
      if (selectedDates.has(d)) selectedDates.delete(d); else selectedDates.add(d);
      renderAll();
    };
  });
}

// League chip group - same multi-select/mutual-narrowing pattern as the
// calendar above, just for league instead of date. Options are drawn
// from the data itself (whatever leagues actually appear), sorted by
// real tier rather than alphabetically, same as the old dropdown was.
function renderLeagueChips() {
  const el = document.getElementById('league-filter');
  const matching = new Set(allMatches().filter(m => matchesFilters(m, { league: true })).map(m => m.league));
  const leagues = [...new Set([...matching, ...selectedLeagues])]
    .sort((a, b) => tierOf({ league: a }) - tierOf({ league: b }));
  const chips = leagues.map(l => {
    const classes = ['chip'];
    if (selectedLeagues.has(l)) classes.push('active');
    return `<button type="button" class="${classes.join(' ')}" data-league="${l}">${l}</button>`;
  }).join('');
  el.innerHTML = `
    <div class="filter-label">League</div>
    <div class="chip-row">${chips || '<div class="chip-empty-note">No leagues match your other filters.</div>'}</div>
  `;
  el.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => {
      const l = btn.dataset.league;
      if (selectedLeagues.has(l)) selectedLeagues.delete(l); else selectedLeagues.add(l);
      renderAll();
    };
  });
}

// District chip group - the universe of possible options is the fixed
// 12-borough list (BERLIN_DISTRICTS), not derived from the data like
// league is, since a district is a real stable place whether or not
// this week's data happens to have a fixture in it. Narrowing still
// applies on top: only districts that currently have a matching
// fixture (or are already selected) get a chip at all.
function renderDistrictChips() {
  const el = document.getElementById('district-filter');
  const matching = new Set(
    allMatches().filter(m => matchesFilters(m, { district: true }))
      .map(m => districtForAddress(m.venue_address))
      .filter(Boolean)
  );
  const districts = BERLIN_DISTRICTS.filter(d => matching.has(d) || selectedDistricts.has(d));
  const chips = districts.map(d => {
    const classes = ['chip'];
    if (selectedDistricts.has(d)) classes.push('active');
    return `<button type="button" class="${classes.join(' ')}" data-district="${d}">${d}</button>`;
  }).join('');
  el.innerHTML = `
    <div class="filter-label">District</div>
    <div class="chip-row">${chips || '<div class="chip-empty-note">No districts match your other filters.</div>'}</div>
  `;
  el.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => {
      const d = btn.dataset.district;
      if (selectedDistricts.has(d)) selectedDistricts.delete(d); else selectedDistricts.add(d);
      renderAll();
    };
  });
}

// Team chip group - unlike league/district (small, near-fixed lists),
// there are potentially hundreds of clubs across all seven tiers, so
// showing every eligible team as a chip all the time would be a wall
// of buttons. Instead: already-selected teams always show as removable
// chips up top; below that, a plain text box narrows a short suggestion
// list (max 8) as you type, and clicking a suggestion adds it to the
// selection. Typing itself never filters the fixture list directly -
// only an actual click (an exact team added to selectedTeams) does -
// that's what makes "two teams at once" possible in the first place.
function renderTeamChips() {
  const el = document.getElementById('team-filter');
  const typed = teamSearchText.trim().toLowerCase();

  const matchingTeams = new Set(
    allMatches().filter(m => matchesFilters(m, { team: true })).flatMap(m => [m.home_team, m.away_team])
  );

  const selectedChips = [...selectedTeams].sort().map(t =>
    `<button type="button" class="chip active" data-team="${t}">${t} ×</button>`
  ).join('');

  let suggestionsHtml = '';
  if (typed) {
    const suggestions = [...matchingTeams]
      .filter(t => !selectedTeams.has(t) && t.toLowerCase().includes(typed))
      .sort()
      .slice(0, 8);
    suggestionsHtml = `<div class="chip-row">${
      suggestions.length
        ? suggestions.map(t => `<button type="button" class="chip" data-team="${t}">${t}</button>`).join('')
        : '<div class="chip-empty-note">No matching teams.</div>'
    }</div>`;
  }

  el.innerHTML = `
    <div class="filter-label">Team</div>
    ${selectedChips ? `<div class="chip-row">${selectedChips}</div>` : ''}
    <input id="team-search-input" type="text" placeholder="Search team to add…" autocomplete="off" value="${teamSearchText.replace(/"/g, '&quot;')}">
    ${suggestionsHtml}
  `;

  el.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => {
      const t = btn.dataset.team;
      if (selectedTeams.has(t)) selectedTeams.delete(t); else selectedTeams.add(t);
      teamSearchText = '';
      renderAll();
    };
  });

  const input = el.querySelector('#team-search-input');
  input.addEventListener('input', (e) => {
    teamSearchText = e.target.value;
    // Only this widget needs to redraw for a keystroke - typing narrows
    // suggestions, it doesn't change any actual selection, so the
    // calendar/league/district chips and the match list below are
    // untouched until a suggestion is actually clicked.
    renderTeamChips();
  });
  if (teamSearchText) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

function renderAll() {
  renderCalendar();
  renderLeagueChips();
  renderDistrictChips();
  renderTeamChips();
  render();
}

// Flat ranked list for "closest to me" / "kick-off time" sort modes -
// deliberately not grouped by date or league like the default view,
// since the whole point is one single ranking across everything in
// scope. Each row still shows its date and league inline (that context
// isn't implicit anymore once there's no date-heading/league-label
// grouping it). `hint` is the small message strip above the results -
// used to tell someone their postcode wasn't recognized rather than
// silently reordering nothing.
function renderFlatSorted(matches, mode, postcodeValue, hint) {
  let list = matches.slice();

  if (mode === 'distance') {
    if (!postcodeValue) {
      hint.textContent = 'Enter your postcode above to sort by distance.';
      list.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
    } else if (!coordsForPlz(postcodeValue)) {
      hint.textContent = `"${postcodeValue}" isn't a Berlin postcode I recognize - showing date order instead.`;
      list.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
    } else {
      list.forEach(m => { m.__distanceKm = distanceFromPostcode(postcodeValue, m.venue_address); });
      list.sort((a, b) => {
        if (a.__distanceKm == null && b.__distanceKm == null) return 0;
        if (a.__distanceKm == null) return 1;
        if (b.__distanceKm == null) return -1;
        return a.__distanceKm - b.__distanceKm;
      });
    }
  } else if (mode === 'time') {
    list.sort((a, b) => {
      if (!a.time && !b.time) return (a.date).localeCompare(b.date);
      if (!a.time) return 1;
      if (!b.time) return -1;
      return a.date === b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date);
    });
  }

  return list.map(m => {
    const tierTag = isCup(m) ? 'Cup' : `Tier ${tierOf(m)}`;
    const distanceNote = m.__distanceKm != null
      ? `<span class="addr">${m.__distanceKm < 1 ? '<1 km away' : Math.round(m.__distanceKm) + ' km away'}</span>`
      : (mode === 'distance' && postcodeValue && coordsForPlz(postcodeValue) ? `<span class="addr">distance unknown</span>` : '');
    return `
      <div class="match">
        <div class="match-time">${m.time || '—'}</div>
        <div>
          <div class="teams">${crestHtml(m.home_team)}${m.home_team}${clubLinkHtml(m.home_team_website)} <span class="vs">vs</span> ${crestHtml(m.away_team)}${m.away_team}${clubLinkHtml(m.away_team_website)}</div>
          <div class="venue">${fmtDateLabel(m.date)} · ${m.league} (${tierTag})${m.venue ? ' · ' + m.venue : ''}${distanceNote}</div>
        </div>
        <div class="matchday">${m.matchday || ''}</div>
      </div>
    `;
  }).join('');
}

// Everything currently selected across ALL FOUR filters (date, league,
// district, team) at once - matchesFilters() (above) is the single
// place that combines them, the same helper the chip-rendering
// functions use to narrow each other. "Scope" below is a separate,
// smaller decision: with nothing at all selected, keep the existing
// "browse one month at a time" behaviour rather than dumping the whole
// dataset; but the moment ANY filter is active (a date, a league, a
// district, or a team), search across everything, so a choice on (say)
// a team doesn't silently miss fixtures outside whatever month happens
// to be currently browsed.
function currentlyVisibleMatches() {
  const anyFilterActive = selectedDates.size || selectedLeagues.size || selectedDistricts.size || selectedTeams.size;
  const scope = anyFilterActive ? allMatches() : datesInCurrentMonth().flatMap(d => allData[d] || []);
  return scope.filter(m => matchesFilters(m));
}

function render() {
  const main = document.getElementById('main');
  const hint = document.getElementById('postcode-hint');
  const sortMode = document.getElementById('sort-mode').value; // "" | "distance" | "time"
  const postcodeValue = document.getElementById('postcode-input').value.trim();
  hint.textContent = '';

  const filtered = currentlyVisibleMatches();

  if (!filtered.length) {
    main.innerHTML = `<div class="empty"><span class="ball">⚽</span>No fixtures found for this combination of filters.</div>`;
    return;
  }

  // "Closest to me" / "kick-off time" are flat ranked lists across
  // whatever's currently in view (every filter above still applies) -
  // deliberately NOT grouped by date or league on top of that, since a
  // genuine distance or time ranking spanning several dates wouldn't
  // make sense chopped up by date headings first. Plain "date" mode
  // below keeps the existing date > league > team grouping.
  if (sortMode === 'distance' || sortMode === 'time') {
    main.innerHTML = renderFlatSorted(filtered, sortMode, postcodeValue, hint);
    return;
  }

  // Sort hierarchy: date > league (by real tier order, not
  // alphabetically) > team. When only one distinct date is left in the
  // filtered results (e.g. a single date picked, or filters happen to
  // narrow everything down to one specific day), that outer "date"
  // level is a no-op - there's only one - so it goes straight to league
  // groups. When several dates remain in view, matches are grouped
  // under a date heading FIRST and league groups sit inside each date.
  function renderLeagueGroups(matches) {
    const byLeague = {};
    matches.forEach(m => {
      (byLeague[m.league] = byLeague[m.league] || []).push(m);
    });
    const orderedLeagues = Object.keys(byLeague).sort((a, b) => {
      const ta = tierOf({ league: a, league_tier: byLeague[a][0]?.league_tier });
      const tb = tierOf({ league: b, league_tier: byLeague[b][0]?.league_tier });
      return ta !== tb ? ta - tb : a.localeCompare(b);
    });
    return orderedLeagues.map(league => {
      const ms = byLeague[league];
      const tier = tierOf(ms[0]);
      const tierTag = isCup(ms[0]) ? 'Cup' : `Tier ${tier}`;
      return `
      <div class="league-group">
        <div class="league-label">
          <span>${league}</span>
          <span class="tier-tag">${tierTag}</span>
        </div>
        ${ms.slice().sort((a,b) => (a.time||'').localeCompare(b.time||'')).map(m => `
          <div class="match">
            <div class="match-time">${m.time || '—'}</div>
            <div>
              <div class="teams">${crestHtml(m.home_team)}${m.home_team}${clubLinkHtml(m.home_team_website)} <span class="vs">vs</span> ${crestHtml(m.away_team)}${m.away_team}${clubLinkHtml(m.away_team_website)}</div>
              <div class="venue">${m.venue || ''}${m.venue_address ? `<span class="addr">${m.venue_address}</span>` : ''}</div>
            </div>
            <div class="matchday">${m.matchday || ''}</div>
          </div>
        `).join('')}
      </div>
    `;
    }).join('');
  }

  const distinctDates = new Set(filtered.map(m => m.date));
  if (distinctDates.size > 1) {
    const byDate = {};
    filtered.forEach(m => { (byDate[m.date] = byDate[m.date] || []).push(m); });
    const orderedDates = Object.keys(byDate).sort();
    main.innerHTML = orderedDates.map(d => `
      <div class="date-heading">${fmtDateLabel(d)}</div>
      ${renderLeagueGroups(byDate[d])}
    `).join('');
  } else {
    main.innerHTML = renderLeagueGroups(filtered);
  }
}

async function init() {
  document.getElementById('sort-mode').addEventListener('change', render);
  // Postcode is only numbers - restrict input as you type rather than
  // waiting to reject it on submit, and re-render on every keystroke so
  // "closest to me" updates live like everything else here.
  document.getElementById('postcode-input').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5);
    render();
  });
  // Clears every filter dimension (dates, leagues, districts, teams,
  // sort mode) back to "everything," and drops back to viewing the
  // whole current month rather than any specific selection - the
  // calendar's month position is reset to the real current month too
  // (see the note further down), same as before. The postcode itself
  // is deliberately NOT cleared - it's more like "who you are" than a
  // transient filter, no reason to make someone retype it just for
  // resetting everything else.
  document.getElementById('reset-filters').addEventListener('click', () => {
    selectedDates.clear();
    selectedLeagues.clear();
    selectedDistricts.clear();
    selectedTeams.clear();
    teamSearchText = '';
    document.getElementById('sort-mode').value = '';
    // Jump back to the CURRENT calendar month specifically, not just
    // "whatever month you happened to be on" - a reset should feel like
    // starting over, and starting over means today, not wherever you'd
    // navigated to. Falls back to the earliest month with any fixtures
    // if the current month itself has none (e.g. between seasons).
    const months = allMonths();
    const thisMonth = monthOf(todayIso());
    currentMonth = months.includes(thisMonth) ? thisMonth : months[0];
    renderAll();
  });

  try {
    const idxResp = await fetch('data/index.json');
    if (!idxResp.ok) throw new Error('no live data');
    const dates = await idxResp.json();
    for (const d of dates) {
      const r = await fetch(`data/${d}.json`);
      if (r.ok) allData[d] = await r.json();
    }
  } catch (e) {
    allData = DEMO_DATA;
  }

  allData = dropPastDates(allData);

  const months = allMonths();
  if (!months.length) {
    document.getElementById('main').innerHTML = `<div class="empty"><span class="ball">⚽</span>No fixture data available yet.</div>`;
    return;
  }
  currentMonth = months[0];
  renderAll();
}

// Drop any date that's already in the past, using the VISITOR'S local
// calendar day (not UTC - a "today" fixture shouldn't vanish for
// someone west of Berlin just because it's already tomorrow in UTC).
// This is a client-side safety net on top of the scrapers' own pruning
// (both scrapers drop past dates when they write data/) - it covers the
// gap between "a match's day ends" and "the next scheduled scrape run
// actually removes it," and also means a stale cached page still looks
// right. A whole month disappears from the month pills automatically
// once every one of its dates has been filtered out here - no separate
// "hide past months" logic needed, it falls out of this for free.
function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function dropPastDates(data) {
  const today = todayIso();
  const kept = {};
  for (const [d, matches] of Object.entries(data)) {
    if (d >= today) kept[d] = matches;
  }
  return kept;
}

init();
</script>
