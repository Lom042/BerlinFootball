<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berlin Football — Fixtures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch: #0f3d2e;
    --pitch-dark: #0a2b20;
    --chalk: #f4f2ea;
    --chalk-dim: #b9c9c0;
    --gold: #d4a73d;
    --red-card: #c1443a;
    --line: rgba(244,242,234,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--pitch-dark);
    background-image:
      repeating-linear-gradient(0deg, var(--pitch) 0px, var(--pitch) 60px, var(--pitch-dark) 60px, var(--pitch-dark) 120px);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 32px 20px 20px;
    text-align: center;
    border-bottom: 2px solid var(--line);
  }
  header .eyebrow {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 48px);
    margin: 0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  header p.sub {
    color: var(--chalk-dim);
    margin-top: 8px;
    font-size: 14px;
  }
  .controls {
    max-width: 900px;
    margin: 20px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .controls-stack {
    max-width: 900px;
    margin: 20px auto 0;
    padding: 0 20px;
  }
  .tier-label {
    font-family: 'Oswald', sans-serif;
    font-size: 10.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 7px;
    text-align: center;
  }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .stepper button.step-btn {
    font-family: 'Oswald', sans-serif;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .stepper button.step-btn:hover { border-color: var(--gold); color: var(--gold); }
  .stepper button.step-btn:disabled { opacity: .3; cursor: default; }
  .jumpmenu { position: relative; display: inline-block; }
  .current-month {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    min-width: 160px;
    text-align: center;
    cursor: pointer;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 2px;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    color: var(--chalk);
  }
  .current-month:hover { border-color: var(--gold); color: var(--gold); }
  .jumpmenu-list {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--pitch-dark);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    gap: 4px;
    grid-template-columns: repeat(3, 1fr);
    z-index: 5;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 280px;
  }
  .jumpmenu-list.open { display: grid; }
  .jumpmenu-list button {
    font-family: 'Oswald', sans-serif;
    background: transparent;
    border: none;
    color: var(--chalk-dim);
    padding: 7px 4px;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    text-align: center;
  }
  .jumpmenu-list button:hover { background: rgba(244,242,234,0.08); color: var(--chalk); }
  .jumpmenu-list button.active { background: var(--gold); color: var(--pitch-dark); font-weight: 600; }
  .dates {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 4px 2px;
    margin-bottom: 16px;
  }
  .date-pill {
    font-family: 'Oswald', sans-serif;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
    letter-spacing: 0.5px;
    transition: all 0.15s ease;
  }
  .date-pill:hover { border-color: var(--gold); color: var(--chalk); }
  .date-pill.active { background: var(--gold); border-color: var(--gold); color: var(--pitch-dark); font-weight: 600; }
  .chips-wrap { margin-bottom: 10px; }
  .chiprow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; min-height: 32px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Oswald', sans-serif;
    background: var(--gold);
    border: none;
    color: var(--pitch-dark);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .chip:hover { opacity: 0.82; }
  .chip-empty { color: var(--chalk-dim); font-size: 13px; font-style: italic; }
  .clear-dates {
    font-family: 'Inter', sans-serif;
    background: transparent;
    border: none;
    color: var(--chalk-dim);
    text-decoration: underline;
    cursor: pointer;
    font-size: 12px;
    padding: 8px 6px;
    white-space: nowrap;
  }
  .clear-dates:hover { color: var(--chalk); }

  select {
    background: var(--pitch-dark);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .search-row {
    max-width: 900px;
    margin: 16px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #postcode-search {
    background: rgba(244,242,234,0.06);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 9px 16px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    width: 220px;
    max-width: 60vw;
  }
  #postcode-search::placeholder { color: var(--chalk-dim); }
  .no-match { text-align: center; color: var(--chalk-dim); padding: 8px 0 0; font-size: 13px; }

  main {
    max-width: 900px;
    margin: 28px auto 60px;
    padding: 0 20px;
  }
  .league-group { margin-bottom: 28px; }
  .league-label {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .cup-tag {
    display: inline-block;
    margin-left: 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--pitch-dark);
    background: var(--gold);
    padding: 2px 7px;
    border-radius: 3px;
    vertical-align: middle;
  }
  .match {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 14px;
    background: rgba(244,242,234,0.04);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .match-time {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--gold);
    text-align: center;
  }
  .teams { font-size: 16px; font-weight: 500; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .teams .vs { color: var(--chalk-dim); font-weight: 400; padding: 0 2px; }
  .crest {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-family: 'Oswald', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--pitch-dark);
    flex-shrink: 0;
  }
  .venue { color: var(--chalk-dim); font-size: 12px; margin-top: 3px; }
  .badge {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--pitch-dark);
    background: var(--chalk-dim);
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .empty {
    text-align: center;
    color: var(--chalk-dim);
    padding: 60px 20px;
    font-size: 15px;
  }
  .empty .ball { font-size: 32px; display: block; margin-bottom: 10px; }
  footer {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 12px;
    padding: 20px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Matchday</div>
  <h1>Berlin Football</h1>
  <p class="sub">Every club, every level — Bundesliga down to the Sportplatz.</p>
</header>

<div class="controls-stack">
  <div class="stepper">
    <button class="step-btn" id="month-prev" aria-label="Previous month" type="button">‹</button>
    <div class="jumpmenu">
      <button class="current-month" id="month-current" type="button"></button>
      <div class="jumpmenu-list" id="month-menu"></div>
    </div>
    <button class="step-btn" id="month-next" aria-label="Next month" type="button">›</button>
  </div>

  <div class="dates" id="dates"></div>

  <div class="chips-wrap">
    <div class="chiprow" id="date-chips"></div>
  </div>

  <div class="controls" style="margin:0; padding:0;">
    <select id="league-filter">
      <option value="">All divisions</option>
    </select>
    <select id="district-filter">
      <option value="">All districts</option>
    </select>
    <select id="team-filter">
      <option value="">All teams</option>
    </select>
  </div>
</div>
<div class="search-row">
  <input id="postcode-search" type="text" placeholder="Search postcode, or type yours for nearest…" autocomplete="off">
</div>

<main id="main">
  <div class="empty">Loading fixtures…</div>
</main>

<footer>Free & ad-free. Data refreshed automatically.</footer>

<script>
// Placeholder fixtures only — not real games. Shown until the live
// scrapers (scraper_openligadb.py / scraper_fussballde.py) have run
// and produced real data/index.json + data/<date>.json files.
// League tiers, top to bottom — used to order league groups on the page
// (not alphabetically, since e.g. "BERLIN-LIGA" would wrongly sort before
// "BL2"). Cup competitions ("DFB-POKAL", "BERLIN-POKAL" — these are the
// exact `league` labels scraper_fussballde.py's CUPS dict writes, via its
// `is_cup: True` fixtures) sort first on any day they run, since a cup
// round replaces league fixtures that weekend rather than sitting
// alongside them.
const LEAGUE_ORDER = [
  "DFB-POKAL", "BERLIN-POKAL",
  "BL1", "BL2", "BL3",
  "REGIONALLIGA NORDOST",
  "OBERLIGA NORDOST",
  "BERLIN-LIGA",
  "LANDESLIGA STAFFEL 1", "LANDESLIGA STAFFEL 2",
  "BEZIRKSLIGA STAFFEL 1", "BEZIRKSLIGA STAFFEL 2", "BEZIRKSLIGA STAFFEL 3"
];
function leagueRank(league) {
  const i = LEAGUE_ORDER.indexOf(league);
  return i === -1 ? LEAGUE_ORDER.length : i;
}

// Berlin's ~190 postcode areas were never drawn along borough lines and
// several genuinely straddle two or more boroughs (e.g. 10965 touches
// Kreuzberg, Schöneberg, Tempelhof AND Neukölln all at once) - where a
// postcode lists more than one locality, this table picks whichever one
// is listed first for that postcode, so a handful of fixtures right on a
// borough border may show the "wrong side" rather than the literal
// truth. Same trade-off this project already makes elsewhere (see

const POSTCODE_RE = /\b(\d{5})\b/;
function extractPostcode(address) {
  const m = POSTCODE_RE.exec(address || "");
  return m ? m[1] : "";
}
function districtFor(address) {
  return POSTCODE_DISTRICT[extractPostcode(address)] || "";
}

// live Zippopotam.us API (free, no signup) - but its German data turned
// out to only be accurate to CITY level, not postcode level: every

// (52.5167, 13.4), which is why every fixture was showing "0.0 km away"
// regardless of how far away it actually was. Real user report caught
// this. Fixed by baking in real per-postcode coordinates instead of
// calling a live API at all - no network dependency, no rate limit, no
// risk of a data provider silently degrading again. Source: WZB Berlin

function coordsFor(postcode) {
  const c = POSTCODE_COORDS[postcode];
  return c ? { lat: c[0], lng: c[1] } : null;
}
function haversineKm(a, b) {
  const R = 6371;
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

let allData = {};
// MONTHS is every month that actually has fixtures, in chronological
// order - computed once real/demo data has loaded (see init()). monthIdx
// is which one the stepper is currently showing.
let MONTHS = [];
let monthIdx = 0;
// Selected dates are completely separate from "which month is the
// stepper showing" - stepping to a different month with the ‹ › arrows
// or the jump menu NEVER touches this Set, only adding/removing a date
// pill or a chip (or "Clear") does. That's what lets a weekend spanning
// two months (e.g. Sat 31 Oct + Sun 01 Nov) be selected as a unit: pick
// the Saturday, step forward a month, pick the Sunday - the first pick
// stays selected the whole time.
let selectedDates = new Set();

// No real club crests are used here (they're trademarked) — instead we
// generate a simple colored monogram per team from its initials.
const CREST_COLORS = ['#d4a73d', '#c1443a', '#6f9c73', '#8891c4', '#c48fa0', '#5fa8a0'];
function teamInitials(name) {
  const words = name.replace(/^\d+\.\s*/, '').split(/\s+/).filter(w => w.length > 1 || /[A-ZÄÖÜ]/.test(w));
  const letters = words.slice(0, 2).map(w => w[0]).join('');
  return (letters || name.slice(0, 2)).toUpperCase();
}
function teamColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return CREST_COLORS[Math.abs(hash) % CREST_COLORS.length];
}
function crestHtml(name) {
  return `<span class="crest" style="background:${teamColor(name)}">${teamInitials(name)}</span>`;
}

function fmtDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' });
}

function monthKey(iso) { return iso.slice(0, 7); } // "YYYY-MM"
function fmtMonthLabel(key) {
  const d = new Date(key + "-01T00:00:00");
  return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}
function fmtMonthShort(key) {
  const d = new Date(key + "-01T00:00:00");
  return d.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
}
function fmtChipLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}

// One stepper (‹ month-name ›), one jump-menu grid for hopping straight
// to a distant month, one row of day-pills for whichever month is
// currently showing. Stepping/jumping months only changes monthIdx -
// it never touches selectedDates (see the comment on that Set above),
// so fixtures already picked in another month stay picked.
function goToMonth(newIdx, allDates) {
  monthIdx = Math.max(0, Math.min(MONTHS.length - 1, newIdx));
  renderMonthStepper(allDates);
  renderDatePills(allDates);
  // Re-render too, not just the pickers - when no date is selected and a
  // league/district filter is active, the fixture list defaults to
  // "whatever month the stepper is showing" (see render()), so stepping
  // months needs to refresh it, not just the pills above it.
  render();
}
function renderMonthStepper(allDates) {
  const mk = MONTHS[monthIdx];
  const currentEl = document.getElementById('month-current');
  const menuEl = document.getElementById('month-menu');
  const prevBtn = document.getElementById('month-prev');
  const nextBtn = document.getElementById('month-next');

  currentEl.textContent = fmtMonthLabel(mk);
  prevBtn.disabled = monthIdx === 0;
  nextBtn.disabled = monthIdx === MONTHS.length - 1;

  menuEl.innerHTML = '';
  MONTHS.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = m === mk ? 'active' : '';
    b.textContent = fmtMonthShort(m);
    b.onclick = () => { goToMonth(i, allDates); menuEl.classList.remove('open'); };
    menuEl.appendChild(b);
  });
}

// Day pills only ever show dates within the CURRENTLY SHOWING month
// (MONTHS[monthIdx]) - clicking one toggles it in/out of selectedDates
// (multi-select), so e.g. both days of a cup weekend can be picked at
// once, whether or not they're in the same month.
function renderDatePills(allDates) {
  const el = document.getElementById('dates');
  const mk = MONTHS[monthIdx];
  const dates = allDates.filter(d => monthKey(d) === mk);
  el.innerHTML = '';
  dates.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'date-pill' + (selectedDates.has(d) ? ' active' : '');
    btn.textContent = fmtDateLabel(d);
    btn.onclick = () => {
      if (selectedDates.has(d)) {
        selectedDates.delete(d);
      } else {
        selectedDates.add(d);
      }
      renderDatePills(allDates);
      renderChips();
      render();
    };
    el.appendChild(btn);
  });
}

// The "Selected dates" chip row is the one part of this UI that ignores
// which month is currently showing - it always lists every date in
// selectedDates, however many different months they span, each one
// clickable to remove just that date. This is what makes a cross-month
// weekend selection visible/manageable at a glance. Each chip is a
// single flat button (label + a trailing ✕) rather than a button nested
// inside another element - simpler, bigger tap target on mobile, and
// consistent with how every other pill on this page is built.
function renderChips() {
  const el = document.getElementById('date-chips');
  el.innerHTML = '';
  const allDates = Object.keys(allData).sort();

  if (!selectedDates.size) {
    const empty = document.createElement('span');
    empty.className = 'chip-empty';
    empty.textContent = 'No dates selected — pick one above.';
    el.appendChild(empty);
    return;
  }

  [...selectedDates].sort().forEach(d => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.type = 'button';
    chip.textContent = fmtChipLabel(d) + '  ✕';
    chip.onclick = () => {
      selectedDates.delete(d);
      renderDatePills(allDates);
      renderChips();
      render();
    };
    el.appendChild(chip);
  });

  const clearBtn = document.createElement('button');
  clearBtn.className = 'clear-dates';
  clearBtn.type = 'button';
  clearBtn.textContent = 'Clear';
  clearBtn.onclick = () => {
    selectedDates.clear();
    renderDatePills(allDates);
    renderChips();
    render();
  };
  el.appendChild(clearBtn);
}

// Splits the "All divisions" dropdown into two <optgroup>s — Cups and
// Leagues — so a cup competition (any match with `is_cup: true`, e.g.
// "BERLIN-POKAL" / "DFB-POKAL") is easy to pick out on its own, separate
// from picking a normal league. A league is only ever ALL cup or ALL
// non-cup matches in practice (cups and leagues never share a `league`
// label), so checking the first match in each group is enough.
function populateLeagueFilter(matches) {
  const sel = document.getElementById('league-filter');
  const byLeague = {};
  matches.forEach(m => { (byLeague[m.league] = byLeague[m.league] || []).push(m); });
  const leagues = Object.keys(byLeague).sort();
  const cups = leagues.filter(l => byLeague[l].some(m => m.is_cup));
  const rest = leagues.filter(l => !byLeague[l].some(m => m.is_cup));

  const optionsHtml = list => list.map(l => `<option value="${l}">${l}</option>`).join('');
  let html = '<option value="">All divisions</option>';
  if (cups.length) html += `<optgroup label="Cups">${optionsHtml(cups)}</optgroup>`;
  if (rest.length) html += `<optgroup label="Leagues">${optionsHtml(rest)}</optgroup>`;
  sel.innerHTML = html;
}

// District dropdown only ever lists boroughs that actually have a
// fixture with a resolvable postcode right now - no point offering a
// district with nothing in it. Blank/unresolved districts are just
// left out rather than shown as an "Unknown" option.
function populateDistrictFilter(matches) {
  const sel = document.getElementById('district-filter');
  const districts = [...new Set(matches.map(m => districtFor(m.venue_address)).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All districts</option>' +
    districts.map(d => `<option value="${d}">${d}</option>`).join('');
}

// Team dropdown - every club that appears as either home or away across
// every fixture, alphabetical, so you can pick a specific club's
// fixtures without typing its name.
function populateTeamFilter(matches) {
  const sel = document.getElementById('team-filter');
  const teams = [...new Set(matches.flatMap(m => [m.home_team, m.away_team]))].sort();
  sel.innerHTML = '<option value="">All teams</option>' +
    teams.map(t => `<option value="${t}">${t}</option>`).join('');
}

function render() {
  const main = document.getElementById('main');
  const leagueFilter = document.getElementById('league-filter').value;
  const districtFilter = document.getElementById('district-filter').value;
  const teamFilter = document.getElementById('team-filter').value;
  const postcodeRaw = document.getElementById('postcode-search').value.trim();
  const postcodeSearch = postcodeRaw.toLowerCase();
  // Only a full, valid, KNOWN Berlin postcode upgrades to nearest-first
  // mode - anything else (partial digits, an unknown code, free text)
  // just falls through to the plain substring match below.
  const originCoords = /^\d{5}$/.test(postcodeRaw) ? coordsFor(postcodeRaw) : null;
  const useNearest = !!originCoords;
  const allDatesSorted = Object.keys(allData).sort();

  // Which dates to pull fixtures from, most specific wins first:
  //   1) an explicit date (or dates) picked below the stepper - always
  //      wins, however every other filter is set.
  //   2) a team or postcode search - these look ACROSS THE WHOLE SEASON
  //      by design (picking "BFC Dynamo" should find every BFC Dynamo
  //      fixture, not just ones in whatever month happens to be
  //      showing - otherwise the search would silently show nothing on
  //      months with no match for it).
  //   3) a league or district filter with nothing else set - defaults
  //      to the month currently showing in the stepper, so picking just
  //      a league/district shows that month's fixtures in it instead of
  //      nothing. Selecting a date (or team/postcode) narrows further
  //      from there.
  //   4) nothing picked at all - the initial "pick a date" prompt.
  let pool;
  if (selectedDates.size) {
    pool = [...selectedDates].flatMap(d => allData[d] || []);
  } else if (teamFilter || postcodeSearch) {
    pool = Object.values(allData).flat();
  } else if (leagueFilter || districtFilter) {
    const mk = MONTHS[monthIdx];
    pool = allDatesSorted.filter(d => monthKey(d) === mk).flatMap(d => allData[d] || []);
  } else {
    pool = [];
  }

  let filtered = leagueFilter ? pool.filter(m => m.league === leagueFilter) : pool;
  if (districtFilter) {
    filtered = filtered.filter(m => districtFor(m.venue_address) === districtFilter);
  }
  if (teamFilter) {
    filtered = filtered.filter(m => m.home_team === teamFilter || m.away_team === teamFilter);
  }
  if (useNearest) {
    // Only fixtures whose venue postcode is in our coordinate table can
    // be ranked by distance - anything else just isn't shown in this
    // mode (same "leave it out rather than guess wrong" approach used
    // elsewhere in this project).
    filtered = filtered.filter(m => coordsFor(extractPostcode(m.venue_address)));
  } else if (postcodeSearch) {
    filtered = filtered.filter(m => (m.venue_address || '').toLowerCase().includes(postcodeSearch));
  }

  if (!filtered.length) {
    let msg;
    if (teamFilter) msg = `No fixtures found for ${teamFilter}.`;
    else if (useNearest) msg = `No fixtures found near postcode "${postcodeRaw}".`;
    else if (postcodeSearch) msg = `No fixtures found for postcode "${document.getElementById('postcode-search').value}".`;
    else if (selectedDates.size) msg = 'No fixtures found for the selected date(s).';
    else if (leagueFilter || districtFilter) msg = `No fixtures found in ${fmtMonthLabel(MONTHS[monthIdx])} for the selected filter(s).`;
    else msg = 'Pick a date above to see fixtures.';
    main.innerHTML = `<div class="empty"><span class="ball">⚽</span>${msg}</div>`;
    return;
  }

  // Nearest-postcode mode bypasses the usual "grouped by league" layout
  // in favour of one flat list sorted closest-first, with a distance in
  // place of the date - the league is still shown, just as the badge.
  if (useNearest) {
    const withDistance = filtered
      .map(m => ({ m, km: haversineKm(originCoords, coordsFor(extractPostcode(m.venue_address))) }))
      .sort((a, b) => a.km - b.km);
    main.innerHTML = `
      <div class="league-group">
        <div class="league-label">Nearest to ${postcodeRaw}</div>
        ${withDistance.map(({ m, km }) => `
          <div class="match">
            <div class="match-time">${m.time || '—'}</div>
            <div>
              <div class="teams">${crestHtml(m.home_team)}${m.home_team} <span class="vs">vs</span> ${crestHtml(m.away_team)}${m.away_team}</div>
              <div class="venue">
                ${km.toFixed(1)} km away · ${fmtDateLabel(m.date)} · ${m.league}${m.matchday ? ' · ' + m.matchday : ''}${m.venue ? ' · ' + m.venue : ''}${m.venue_address ? ' — ' + m.venue_address : ''}
              </div>
            </div>
            <div class="badge">${m.league}</div>
          </div>
        `).join('')}
      </div>
    `;
    return;
  }

  const byLeague = {};
  filtered.forEach(m => {
    (byLeague[m.league] = byLeague[m.league] || []).push(m);
  });

  // Leagues sorted by tier (cup competitions first when they're running,
  // then top flight down to Bezirksliga) rather than alphabetically — so
  // e.g. BERLIN-LIGA doesn't wrongly sort above BL2. Matches within a
  // league sort by kickoff time, then team name.
  const orderedLeagues = Object.keys(byLeague).sort((a, b) => leagueRank(a) - leagueRank(b));

  // Show each match's own date whenever the current result spans more
  // than one - true whether that's because of a whole-month/season view
  // or a multi-date chip selection - not just when there's a search term.
  const distinctDates = new Set(filtered.map(m => m.date)).size;

  main.innerHTML = orderedLeagues.map(league => { const ms = byLeague[league]; const isCup = ms.some(m => m.is_cup); return `
    <div class="league-group">
      <div class="league-label">${league}${isCup ? '<span class="cup-tag">CUP</span>' : ''}</div>
      ${ms.sort((a,b) => (a.date + (a.time||'') + a.home_team).localeCompare(b.date + (b.time||'') + b.home_team)).map(m => `
        <div class="match">
          <div class="match-time">${m.time || '—'}</div>
          <div>
            <div class="teams">${crestHtml(m.home_team)}${m.home_team} <span class="vs">vs</span> ${crestHtml(m.away_team)}${m.away_team}</div>
            <div class="venue">
              ${distinctDates > 1 ? fmtDateLabel(m.date) + ' · ' : ''}${m.matchday ? m.matchday + ' · ' : ''}${m.venue || ''}${m.venue_address ? ' — ' + m.venue_address : ''}
            </div>
          </div>
          <div class="badge">${league}</div>
        </div>
      `).join('')}
    </div>
  `; }).join('');
}

async function init() {
  document.getElementById('league-filter').addEventListener('change', render);
  document.getElementById('district-filter').addEventListener('change', render);
  document.getElementById('team-filter').addEventListener('change', render);
  document.getElementById('postcode-search').addEventListener('input', render);

  const menuEl = document.getElementById('month-menu');
  document.getElementById('month-prev').addEventListener('click', () => goToMonth(monthIdx - 1, Object.keys(allData).sort()));
  document.getElementById('month-next').addEventListener('click', () => goToMonth(monthIdx + 1, Object.keys(allData).sort()));
  document.getElementById('month-current').addEventListener('click', () => menuEl.classList.toggle('open'));
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.jumpmenu')) menuEl.classList.remove('open');
  });

  try {
    const idxResp = await fetch('data/index.json');
    if (!idxResp.ok) throw new Error('no live data');
    const dates = await idxResp.json();
    for (const d of dates) {
      const r = await fetch(`data/${d}.json`);
      if (r.ok) allData[d] = await r.json();
    }
  } catch (e) {
    allData = DEMO_DATA;
  }

  const dates = Object.keys(allData).sort();
  if (!dates.length) {
    document.getElementById('main').innerHTML = `<div class="empty"><span class="ball">⚽</span>No fixture data available yet.</div>`;
    return;
  }
  // MONTHS is every month that actually has fixtures, oldest to newest -
  // read straight off the real data each time (see the "note" in the
  // design writeup: no hardcoded year/season list, so this keeps working
  // for 2027-28 and beyond with zero code changes, same as the rolling
  // data/index.json window already does).
  MONTHS = [...new Set(dates.map(monthKey))];

  // Default to today's month (or the first month with fixtures, if
  // today's has none), with just its first date pre-picked as a single
  // stand-alone selection - same starting point as clicking that date by
  // hand, not "every date in the month".
  const todayKey = new Date().toISOString().slice(0, 7);
  const startMonthIdx = MONTHS.includes(todayKey) ? MONTHS.indexOf(todayKey) : 0;
  monthIdx = startMonthIdx;
  const firstOfStartMonth = dates.find(d => monthKey(d) === MONTHS[monthIdx]);
  selectedDates = new Set(firstOfStartMonth ? [firstOfStartMonth] : []);

  renderMonthStepper(dates);
  renderDatePills(dates);
  renderChips();
  populateLeagueFilter(Object.values(allData).flat());
  populateDistrictFilter(Object.values(allData).flat());
  populateTeamFilter(Object.values(allData).flat());
  render();
}

init();
</script>

</body>
</html>
