<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berlin Football — Fixtures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch: #0f3d2e;
    --pitch-dark: #0a2b20;
    --chalk: #f4f2ea;
    --chalk-dim: #b9c9c0;
    --gold: #d4a73d;
    --red-card: #c1443a;
    --line: rgba(244,242,234,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--pitch-dark);
    background-image:
      repeating-linear-gradient(0deg, var(--pitch) 0px, var(--pitch) 60px, var(--pitch-dark) 60px, var(--pitch-dark) 120px);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 32px 20px 20px;
    text-align: center;
    border-bottom: 2px solid var(--line);
  }
  header .eyebrow {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 48px);
    margin: 0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  header p.sub {
    color: var(--chalk-dim);
    margin-top: 8px;
    font-size: 14px;
  }
  .controls {
    max-width: 900px;
    margin: 20px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .dates {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px;
  }
  .date-pill {
    font-family: 'Oswald', sans-serif;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
    letter-spacing: 0.5px;
    transition: all 0.15s ease;
  }
  .date-pill:hover { border-color: var(--gold); color: var(--chalk); }
  .date-pill.active { background: var(--gold); border-color: var(--gold); color: var(--pitch-dark); font-weight: 600; }

  select {
    background: var(--pitch-dark);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .search-row {
    max-width: 900px;
    margin: 16px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #team-search {
    background: rgba(244,242,234,0.06);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 9px 16px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    width: 220px;
    max-width: 60vw;
  }
  #team-search::placeholder { color: var(--chalk-dim); }
  .no-match { text-align: center; color: var(--chalk-dim); padding: 8px 0 0; font-size: 13px; }

  main {
    max-width: 900px;
    margin: 28px auto 60px;
    padding: 0 20px;
  }
  .league-group { margin-bottom: 28px; }
  .league-label {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .cup-tag {
    display: inline-block;
    margin-left: 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--pitch-dark);
    background: var(--gold);
    padding: 2px 7px;
    border-radius: 3px;
    vertical-align: middle;
  }
  .match {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 14px;
    background: rgba(244,242,234,0.04);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .match-time {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--gold);
    text-align: center;
  }
  .teams { font-size: 16px; font-weight: 500; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .teams .vs { color: var(--chalk-dim); font-weight: 400; padding: 0 2px; }
  .crest {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-family: 'Oswald', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--pitch-dark);
    flex-shrink: 0;
  }
  .venue { color: var(--chalk-dim); font-size: 12px; margin-top: 3px; }
  .badge {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--pitch-dark);
    background: var(--chalk-dim);
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .empty {
    text-align: center;
    color: var(--chalk-dim);
    padding: 60px 20px;
    font-size: 15px;
  }
  .empty .ball { font-size: 32px; display: block; margin-bottom: 10px; }
  footer {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 12px;
    padding: 20px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Matchday</div>
  <h1>Berlin Football</h1>
  <p class="sub">Every club, every level — Bundesliga down to the local pitch.</p>
</header>

<div class="controls">
  <div class="dates" id="dates"></div>
  <select id="league-filter">
    <option value="">All divisions</option>
  </select>
</div>
<div class="search-row">
  <input id="team-search" type="text" placeholder="Search team…" autocomplete="off">
</div>

<main id="main">
  <div class="empty">Loading fixtures…</div>
</main>

<footer>Free & ad-free. Data refreshed automatically.</footer>

<script>
// Placeholder fixtures only — not real games. Shown until the live
// scrapers (scraper_openligadb.py / scraper_fussballde.py) have run
// and produced real data/index.json + data/<date>.json files.
// League tiers, top to bottom — used to order league groups on the page
// (not alphabetically, since e.g. "BERLIN-LIGA" would wrongly sort before
// "BL2"). Cup competitions ("DFB-POKAL", "BERLIN-POKAL" — these are the
// exact `league` labels scraper_fussballde.py's CUPS dict writes, via its
// `is_cup: True` fixtures) sort first on any day they run, since a cup
// round replaces league fixtures that weekend rather than sitting
// alongside them.
const LEAGUE_ORDER = [
  "DFB-POKAL", "BERLIN-POKAL",
  "BL1", "BL2", "BL3",
  "REGIONALLIGA NORDOST",
  "OBERLIGA NORDOST",
  "BERLIN-LIGA",
  "LANDESLIGA STAFFEL 1", "LANDESLIGA STAFFEL 2",
  "BEZIRKSLIGA STAFFEL 1", "BEZIRKSLIGA STAFFEL 2", "BEZIRKSLIGA STAFFEL 3"
];
function leagueRank(league) {
  const i = LEAGUE_ORDER.indexOf(league);
  return i === -1 ? LEAGUE_ORDER.length : i;
}

const DEMO_DATA = {
  "2026-08-08": [
    { date: "2026-08-08", time: "15:30", home_team: "Hertha BSC", away_team: "SV Waldhof Mannheim", league: "BL2", gender: "men", matchday: "Matchday 4", venue: "Olympiastadion Berlin", venue_address: "Olympischer Platz 3, 14053 Berlin" },
    { date: "2026-08-08", time: "13:00", home_team: "BFC Dynamo", away_team: "Chemnitzer FC", league: "REGIONALLIGA NORDOST", gender: "men", matchday: "Matchday 5", venue: "Sportforum Berlin", venue_address: "Conrad-Blenkle-Straße 55, 10315 Berlin" },
    { date: "2026-08-08", time: "14:00", home_team: "VSG Altglienicke", away_team: "Tasmania Berlin", league: "REGIONALLIGA NORDOST", gender: "men", matchday: "Matchday 5", venue: "Sportpark Altglienicke", venue_address: "Rudolf-Seiffert-Straße 100, 12524 Berlin" },
    { date: "2026-08-08", time: "14:00", home_team: "Berliner AK 07", away_team: "SV Lichtenberg 47", league: "OBERLIGA NORDOST", gender: "men", matchday: "Matchday 3", venue: "Poststadion", venue_address: "Lehrter Straße 59, 10557 Berlin" },
    { date: "2026-08-08", time: "15:00", home_team: "Tennis Borussia Berlin", away_team: "TuS Makkabi Berlin", league: "OBERLIGA NORDOST", gender: "men", matchday: "Matchday 3", venue: "Mommsenstadion", venue_address: "Waldschulallee 34, 14052 Berlin" }
  ],
  "2026-08-09": [
    { date: "2026-08-09", time: "14:00", home_team: "Hertha 03 Zehlendorf", away_team: "Eintracht Mahlsdorf", league: "OBERLIGA NORDOST", gender: "men", matchday: "Matchday 3", venue: "Rehwiese", venue_address: "Clayallee 330, 14169 Berlin" },
    { date: "2026-08-09", time: "14:00", home_team: "Füchse Berlin Reinickendorf", away_team: "SV Sparta Lichtenberg", league: "OBERLIGA NORDOST", gender: "men", matchday: "Matchday 3", venue: "Stadion Reinickendorf", venue_address: "Provinzstraße 40, 13409 Berlin" },
    { date: "2026-08-09", time: "13:00", home_team: "SC Staaken", away_team: "TSG Neustrelitz", league: "OBERLIGA NORDOST", gender: "men", matchday: "Matchday 3", venue: "Stadion Staaken", venue_address: "Nennhauser Damm 111, 13591 Berlin" }
  ],
  "2026-08-15": [
    { date: "2026-08-15", time: "15:30", home_team: "1. FC Union Berlin", away_team: "SC Freiburg", league: "BL1", gender: "men", matchday: "Matchday 2", venue: "Stadion An der Alten Försterei", venue_address: "Hämmerlingstraße 68-90, 12555 Berlin" },
    { date: "2026-08-15", time: "14:00", home_team: "Tasmania Berlin", away_team: "BFC Dynamo", league: "REGIONALLIGA NORDOST", gender: "men", matchday: "Matchday 6", venue: "Werner-Seelenbinder-Sportpark", venue_address: "Neuköllnische Allee 137, 12057 Berlin" },
    { date: "2026-08-16", time: "14:00", home_team: "Blau-Weiss 90 Berlin", away_team: "1. FC Wilmersdorf", league: "BERLIN-LIGA", gender: "men", matchday: "Matchday 2", venue: "Poststadion Nebenplatz", venue_address: "Lehrter Straße 59, 10557 Berlin" },
    { date: "2026-08-16", time: "14:00", home_team: "SC Charlottenburg", away_team: "Spandauer Kickers", league: "BERLIN-LIGA", gender: "men", matchday: "Matchday 2", venue: "Mommsenstadion", venue_address: "Waldschulallee 34, 14052 Berlin" }
  ],
  "2026-08-22": [
    { date: "2026-08-22", time: "13:00", home_team: "SSC Südwest", away_team: "Fortuna Biesdorf", league: "BERLIN-LIGA", gender: "men", matchday: "Matchday 3", venue: "Poststadion", venue_address: "Lehrter Straße 59, 10557 Berlin" },
    { date: "2026-08-22", time: "14:00", home_team: "Türkiyemspor Berlin", away_team: "SV Empor Berlin", league: "BERLIN-LIGA", gender: "men", matchday: "Matchday 3", venue: "Stadion Rathenower Straße", venue_address: "Rathenower Straße 39, 10559 Berlin" },
    { date: "2026-08-22", time: "14:00", home_team: "TSV Mariendorf 1897", away_team: "Frohnauer SC", league: "BERLIN-LIGA", gender: "men", matchday: "Matchday 3", venue: "Sportplatz Mariendorf", venue_address: "Rathausstraße 5, 12105 Berlin" }
  ],
  // Berlin-Pokal (the Berlin Cup) round — cup weekends replace league
  // fixtures rather than sitting alongside them, and this label
  // ("BERLIN-POKAL") matches the real `league` value
  // scraper_fussballde.py's CUPS dict writes for this competition, via
  // its `is_cup: True` fixtures.
  "2026-10-03": [
    { date: "2026-10-03", time: "14:00", home_team: "Tennis Borussia Berlin", away_team: "BFC Dynamo", league: "BERLIN-POKAL", is_cup: true, gender: "men", matchday: "Round 3", venue: "Mommsenstadion", venue_address: "Waldschulallee 34, 14052 Berlin" },
    { date: "2026-10-03", time: "14:00", home_team: "Berliner AK 07", away_team: "VSG Altglienicke", league: "BERLIN-POKAL", is_cup: true, gender: "men", matchday: "Round 3", venue: "Poststadion", venue_address: "Lehrter Straße 59, 10557 Berlin" },
    { date: "2026-10-03", time: "13:00", home_team: "SC Staaken", away_team: "Tasmania Berlin", league: "BERLIN-POKAL", is_cup: true, gender: "men", matchday: "Round 3", venue: "Stadion Staaken", venue_address: "Nennhauser Damm 111, 13591 Berlin" },
    { date: "2026-10-03", time: "13:00", home_team: "Blau-Weiss 90 Berlin", away_team: "Hertha 03 Zehlendorf", league: "BERLIN-POKAL", is_cup: true, gender: "men", matchday: "Round 3", venue: "Poststadion Nebenplatz", venue_address: "Lehrter Straße 59, 10557 Berlin" }
  ]
};

let allData = {};
let currentDate = null;

// No real club crests are used here (they're trademarked) — instead we
// generate a simple colored monogram per team from its initials.
const CREST_COLORS = ['#d4a73d', '#c1443a', '#6f9c73', '#8891c4', '#c48fa0', '#5fa8a0'];
function teamInitials(name) {
  const words = name.replace(/^\d+\.\s*/, '').split(/\s+/).filter(w => w.length > 1 || /[A-ZÄÖÜ]/.test(w));
  const letters = words.slice(0, 2).map(w => w[0]).join('');
  return (letters || name.slice(0, 2)).toUpperCase();
}
function teamColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return CREST_COLORS[Math.abs(hash) % CREST_COLORS.length];
}
function crestHtml(name) {
  return `<span class="crest" style="background:${teamColor(name)}">${teamInitials(name)}</span>`;
}

function fmtDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' });
}

function renderDatePills(dates) {
  const el = document.getElementById('dates');
  el.innerHTML = '';
  dates.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'date-pill' + (d === currentDate ? ' active' : '');
    btn.textContent = fmtDateLabel(d);
    btn.onclick = () => { currentDate = d; render(); };
    el.appendChild(btn);
  });
}

// Splits the "All divisions" dropdown into two <optgroup>s — Cups and
// Leagues — so a cup competition (any match with `is_cup: true`, e.g.
// "BERLIN-POKAL" / "DFB-POKAL") is easy to pick out on its own, separate
// from picking a normal league. A league is only ever ALL cup or ALL
// non-cup matches in practice (cups and leagues never share a `league`
// label), so checking the first match in each group is enough.
function populateLeagueFilter(matches) {
  const sel = document.getElementById('league-filter');
  const byLeague = {};
  matches.forEach(m => { (byLeague[m.league] = byLeague[m.league] || []).push(m); });
  const leagues = Object.keys(byLeague).sort();
  const cups = leagues.filter(l => byLeague[l].some(m => m.is_cup));
  const rest = leagues.filter(l => !byLeague[l].some(m => m.is_cup));

  const optionsHtml = list => list.map(l => `<option value="${l}">${l}</option>`).join('');
  let html = '<option value="">All divisions</option>';
  if (cups.length) html += `<optgroup label="Cups">${optionsHtml(cups)}</optgroup>`;
  if (rest.length) html += `<optgroup label="Leagues">${optionsHtml(rest)}</optgroup>`;
  sel.innerHTML = html;
}

function render() {
  const main = document.getElementById('main');
  const leagueFilter = document.getElementById('league-filter').value;
  const searchTerm = document.getElementById('team-search').value.trim().toLowerCase();

  // If searching by team, look across ALL dates, not just the selected one —
  // otherwise a search would silently show nothing on days with no matches.
  const pool = searchTerm
    ? Object.values(allData).flat()
    : (allData[currentDate] || []);

  let filtered = leagueFilter ? pool.filter(m => m.league === leagueFilter) : pool;
  if (searchTerm) {
    filtered = filtered.filter(m =>
      m.home_team.toLowerCase().includes(searchTerm) ||
      m.away_team.toLowerCase().includes(searchTerm)
    );
  }

  if (!filtered.length) {
    const msg = searchTerm ? `No fixtures found for "${document.getElementById('team-search').value}".` : 'No fixtures found for this day.';
    main.innerHTML = `<div class="empty"><span class="ball">⚽</span>${msg}</div>`;
    return;
  }

  const byLeague = {};
  filtered.forEach(m => {
    (byLeague[m.league] = byLeague[m.league] || []).push(m);
  });

  // Leagues sorted by tier (cup competitions first when they're running,
  // then top flight down to Bezirksliga) rather than alphabetically — so
  // e.g. BERLIN-LIGA doesn't wrongly sort above BL2. Matches within a
  // league sort by kickoff time, then team name.
  const orderedLeagues = Object.keys(byLeague).sort((a, b) => leagueRank(a) - leagueRank(b));

  main.innerHTML = orderedLeagues.map(league => { const ms = byLeague[league]; const isCup = ms.some(m => m.is_cup); return `
    <div class="league-group">
      <div class="league-label">${league}${isCup ? '<span class="cup-tag">CUP</span>' : ''}</div>
      ${ms.sort((a,b) => (a.date + (a.time||'') + a.home_team).localeCompare(b.date + (b.time||'') + b.home_team)).map(m => `
        <div class="match">
          <div class="match-time">${m.time || '—'}</div>
          <div>
            <div class="teams">${crestHtml(m.home_team)}${m.home_team} <span class="vs">vs</span> ${crestHtml(m.away_team)}${m.away_team}</div>
            <div class="venue">
              ${searchTerm ? fmtDateLabel(m.date) + ' · ' : ''}${m.matchday ? m.matchday + ' · ' : ''}${m.venue || ''}${m.venue_address ? ' — ' + m.venue_address : ''}
            </div>
          </div>
          <div class="badge">${league}</div>
        </div>
      `).join('')}
    </div>
  `; }).join('');
}

async function init() {
  document.getElementById('league-filter').addEventListener('change', render);
  document.getElementById('team-search').addEventListener('input', render);

  try {
    const idxResp = await fetch('data/index.json');
    if (!idxResp.ok) throw new Error('no live data');
    const dates = await idxResp.json();
    for (const d of dates) {
      const r = await fetch(`data/${d}.json`);
      if (r.ok) allData[d] = await r.json();
    }
  } catch (e) {
    allData = DEMO_DATA;
  }

  const dates = Object.keys(allData).sort();
  if (!dates.length) {
    document.getElementById('main').innerHTML = `<div class="empty"><span class="ball">⚽</span>No fixture data available yet.</div>`;
    return;
  }
  currentDate = dates[0];
  renderDatePills(dates);
  populateLeagueFilter(Object.values(allData).flat());
  render();
}

init();
</script>

</body>
</html>
