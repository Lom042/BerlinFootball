name: Update Berlin football fixtures

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-openligadb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run OpenLigaDB scraper
        run: python scraper_openligadb.py

      - name: Commit updated fixtures
        run: |
          git config user.name "berlin-football-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Update fixtures ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
